<style>
:root{
  --bg:#E7ECEE;
  --surface:#FFFFFF;
  --surface-2:#F2F6F7;
  --ink:#121A1F;
  --muted:#5E707B;
  --line:#D3DBDF;
  --line-2:#BCC8CE;
  --steel:#111C24;
  --steel-2:#1B2A34;
  --steel-ink:#EDF3F5;
  --steel-muted:#93A7B2;
  --loc:#F5C518;
  --loc-ink:#241F05;
  --loc-edge:#BE9600;
  --act:#0A5B6A;
  --act-ink:#FFFFFF;
  --act-soft:#DEECEF;
  --alert:#A63E11;
  --alert-soft:#F8E7DE;
  --shadow:0 1px 1px rgba(17,28,36,.04), 0 10px 22px -18px rgba(17,28,36,.5);
  --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1215; --surface:#151E24; --surface-2:#111a1f;
    --ink:#E2EAEE; --muted:#8B9DA8; --line:#26333A; --line-2:#36454D;
    --steel:#080E12; --steel-2:#131F27; --steel-ink:#E8F1F4; --steel-muted:#8CA1AD;
    --loc:#F5C518; --loc-ink:#241F05; --loc-edge:#8F7000;
    --act:#4CA9BA; --act-ink:#05222A; --act-soft:#12303A;
    --alert:#E5885A; --alert-soft:#2C1C15;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 10px 22px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1215; --surface:#151E24; --surface-2:#111a1f;
  --ink:#E2EAEE; --muted:#8B9DA8; --line:#26333A; --line-2:#36454D;
  --steel:#080E12; --steel-2:#131F27; --steel-ink:#E8F1F4; --steel-muted:#8CA1AD;
  --loc:#F5C518; --loc-ink:#241F05; --loc-edge:#8F7000;
  --act:#4CA9BA; --act-ink:#05222A; --act-soft:#12303A;
  --alert:#E5885A; --alert-soft:#2C1C15;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 10px 22px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px;
  line-height:1.45; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--loc); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ============ barra superior ============ */
.top{
  position:sticky; top:0; z-index:40; background:var(--steel); color:var(--steel-ink);
  border-bottom:3px solid var(--loc);
  padding:10px 14px 11px; padding-top:max(10px, env(safe-area-inset-top));
}
.brandrow{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.brand{
  font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand span{color:var(--steel-muted); font-weight:400; font-size:13px}
.iconbtn{
  background:transparent; border:1px solid rgba(255,255,255,.16); border-radius:8px;
  width:34px; height:34px; display:grid; place-items:center; color:var(--steel-muted); flex:none;
  transition:border-color .12s, color .12s;
}
.iconbtn:hover{color:var(--steel-ink); border-color:rgba(255,255,255,.42)}

.searchwrap{position:relative; display:flex; align-items:center}
.searchwrap > svg{position:absolute; left:12px; color:var(--steel-muted); pointer-events:none}
#q{
  width:100%; padding:11px 40px 11px 38px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07); color:var(--steel-ink); border-radius:9px;
  font-size:16px; font-weight:500; transition:border-color .12s, background .12s;
}
#q::placeholder{color:var(--steel-muted)}
#q:focus{border-color:var(--loc); background:rgba(255,255,255,.12); outline:none}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none; appearance:none}
#clearq{
  position:absolute; right:6px; border:none; background:none; color:var(--steel-muted);
  width:30px; height:30px; border-radius:6px; display:none; place-items:center; font-size:15px;
}
#clearq.on{display:grid}
#clearq:hover{color:var(--steel-ink)}

.filters{display:flex; gap:6px; margin-top:9px; overflow-x:auto; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{
  border:1px solid rgba(255,255,255,.18); background:transparent; color:var(--steel-muted);
  padding:5px 11px; border-radius:7px; font-size:12.5px; font-weight:600; white-space:nowrap;
  flex:none; font-family:var(--mono); letter-spacing:.01em; transition:all .12s;
}
.filters .chip:hover{border-color:rgba(255,255,255,.4); color:var(--steel-ink)}
.filters .chip[aria-pressed="true"]{background:var(--steel-ink); border-color:var(--steel-ink); color:var(--steel)}
.filters .chip:first-child,.filters .chip#cs{font-family:var(--sans)}

/* ============ abas ============ */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:45; display:grid;
  grid-template-columns:repeat(5,1fr); background:var(--steel);
  border-top:1px solid rgba(255,255,255,.1); padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  border:none; background:none; color:var(--steel-muted); padding:9px 2px 10px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:600; position:relative; transition:color .12s;
}
.tab::before{
  content:''; position:absolute; top:0; left:18%; right:18%; height:2px;
  background:var(--loc); opacity:0; transition:opacity .15s;
}
.tab[aria-selected="true"]{color:var(--loc)}
.tab{white-space:nowrap}
@media (max-width:420px){ .tab{font-size:10.5px; padding-left:0; padding-right:0} }
.tab[aria-selected="true"]::before{opacity:1}
.tab .n{
  font-size:10px; font-weight:700; background:var(--loc); color:var(--loc-ink); border-radius:99px;
  padding:0 5px; position:absolute; top:4px; left:calc(50% + 8px); font-family:var(--mono);
}

/* ============ conteudo ============ */
main{padding:14px 14px 92px}
.count{
  color:var(--muted); font-size:12px; font-weight:600; margin:0 2px 10px;
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
}
.count span:last-child{font-family:var(--mono); font-weight:500; color:var(--ink); white-space:nowrap}
.list{display:flex; flex-direction:column; gap:7px}

/* ============ cartao ============ */
.card{
  width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--loc-edge); border-radius:10px; padding:11px 13px; display:block;
  box-shadow:var(--shadow); transition:border-color .12s, transform .08s;
}
.card:hover{border-color:var(--line-2); border-left-color:var(--loc)}
.card:active{transform:scale(.995)}
.card.aviso{border-left-color:var(--alert)}
.card.zero{background:var(--surface-2); border-left-color:var(--line-2); box-shadow:none}
.l1{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.code{
  font-family:var(--mono); font-size:12px; font-weight:500; color:var(--muted);
  letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.fil{
  font-family:var(--mono); font-size:10.5px; font-weight:500; color:var(--muted);
  margin-left:auto; background:var(--surface-2); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px;
}
.desc{
  font-weight:600; font-size:14.5px; line-height:1.3; margin:0 0 9px; letter-spacing:-.005em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.l3{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.loc{
  font-family:var(--mono); font-weight:600; font-size:12.5px; letter-spacing:.05em;
  background:var(--loc); color:var(--loc-ink); border-radius:4px; padding:4px 9px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
}
.loc.none{
  background:transparent; color:var(--alert); border:1px dashed var(--alert);
  box-shadow:none; font-weight:500; letter-spacing:.01em; font-family:var(--sans); font-size:12px;
}
.qty{margin-left:auto; text-align:right; line-height:1.05; flex:none; padding-left:8px}
.qty b{
  font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.qty small{display:block; font-size:10px; color:var(--muted); font-weight:600; margin-top:3px}
.qty.z b{color:var(--muted); font-weight:400}
.flag{
  font-size:11px; font-weight:600; padding:3px 7px; border-radius:4px;
  background:var(--alert-soft); color:var(--alert);
}
.flag.ok{background:var(--act-soft); color:var(--act)}
.flag.ctrl{background:transparent; color:var(--act); border:1px solid var(--act); padding:2px 6px}
.flag.nctrl{background:var(--surface-2); color:var(--muted); border:1px solid var(--line-2); padding:2px 6px}
.flag.sctrl{background:transparent; color:var(--muted); border:1px dashed var(--line-2); padding:2px 6px; font-weight:500}
.arm{
  font-family:var(--mono); font-size:11px; font-weight:500; color:var(--muted);
  background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:2px 6px;
}

/* ============ painel ============ */
.panel{
  position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .22s cubic-bezier(.32,.72,0,1); visibility:hidden;
}
.panel.open{transform:none; visibility:visible}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.phead{
  background:var(--steel); color:var(--steel-ink); border-bottom:3px solid var(--loc);
  padding:13px 14px; padding-top:max(13px, env(safe-area-inset-top));
  display:flex; gap:11px; align-items:flex-start;
}
.phead h2{margin:0; font-size:16px; font-weight:600; line-height:1.3; flex:1; letter-spacing:-.01em}
.phead .code{color:var(--steel-muted); font-size:11.5px; display:block; margin-top:5px}
.phead .iconbtn{margin-top:1px}
.pbody{flex:1; overflow-y:auto; padding:13px 14px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch}

.numeros{
  display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface);
  border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:10px;
  box-shadow:var(--shadow);
}
.numeros div{padding:12px 8px; text-align:center; border-right:1px solid var(--line)}
.numeros div:last-child{border-right:none}
.numeros b{
  display:block; font-family:var(--mono); font-size:22px; font-weight:600;
  letter-spacing:-.03em; line-height:1.15; font-variant-numeric:tabular-nums;
}
.numeros small{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:3px; display:block}
.numeros .hi{background:var(--act-soft)}
.numeros .hi b{color:var(--act)}
.numeros .hi small{color:var(--act)}

.block{
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:13px; margin-bottom:10px; box-shadow:var(--shadow);
}
.block h3{
  margin:0 0 10px; font-size:11.5px; font-weight:700; color:var(--muted);
  letter-spacing:.02em; display:flex; align-items:center; gap:7px;
}
.block h3::after{content:''; flex:1; height:1px; background:var(--line)}
.locrow{display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line)}
.locrow:first-of-type{padding-top:0}
.locrow:last-child{border-bottom:none; padding-bottom:0}
.locrow .qn{
  margin-left:auto; font-family:var(--mono); font-weight:600; font-size:17px;
  font-variant-numeric:tabular-nums;
}
.locrow em{font-style:normal; font-size:12px; color:var(--alert); font-weight:500; line-height:1.4}
.kv{display:grid; grid-template-columns:1fr auto; gap:7px 14px; font-size:13.5px; margin:0}
.kv dt{color:var(--muted)}
.kv dd{
  margin:0; font-family:var(--mono); font-weight:500; text-align:right;
  font-variant-numeric:tabular-nums;
}
.kv dd.warn{color:var(--alert)}
.btnrow{display:flex; gap:8px; margin-bottom:10px}
.btn{
  flex:1; border:1px solid var(--act); background:var(--act); color:var(--act-ink);
  border-radius:9px; padding:12px; font-weight:600; font-size:14px; transition:filter .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface); color:var(--act)}
.btn:disabled{opacity:.5; cursor:default}

/* ============ enderecos ============ */
.ruas{
  display:flex; flex-wrap:nowrap; gap:6px; margin-bottom:14px; overflow-x:auto;
  scrollbar-width:none; padding-bottom:2px;
}
.ruas::-webkit-scrollbar{display:none}
.rua{
  flex:none; border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:7px 10px; font-family:var(--mono); font-weight:600; font-size:12.5px;
  letter-spacing:.03em; transition:all .12s;
}
.rua:hover{border-color:var(--line-2)}
.rua[aria-pressed="true"]{background:var(--steel); border-color:var(--steel); color:var(--loc)}
.rua i{font-style:normal; font-weight:400; color:var(--muted); font-size:11px; margin-left:5px}
.rua.txt{font-family:var(--sans); letter-spacing:0}
/* selecao de produtos para separar */
.barra-sel{
  position:sticky; top:var(--top-h,0px); z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--bg); padding:8px 2px 10px; border-bottom:1px solid var(--line);
}
.selall{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; color:var(--ink);
  cursor:pointer; user-select:none}
.selall i{font-style:normal; color:var(--muted); font-weight:500; font-family:var(--mono); font-size:12px}
.selall input,.marca input{width:21px; height:21px; accent-color:var(--act); cursor:pointer; margin:0}
.barra-sel .acoes{margin-left:auto; display:flex; align-items:center; gap:8px}
.barra-sel .nsel{font-size:12.5px; font-weight:700; color:var(--act)}
.btn.mini{flex:none; padding:8px 14px; font-size:13px}
.dica-sel{margin-left:auto; font-size:12px; color:var(--muted)}
.linha-sel{display:flex; gap:7px; align-items:stretch}
.linha-sel .card{flex:1; min-width:0}
.marca{flex:none; width:42px; display:grid; place-items:center; border-radius:10px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); transition:background .12s, border-color .12s}
.marca:hover{border-color:var(--act)}
.marca.vazia{background:transparent; border-color:transparent; cursor:default}
.linha-sel.on .marca{background:var(--act-soft); border-color:var(--act)}
.linha-sel.on .card{border-color:var(--act); box-shadow:0 0 0 1px var(--act)}
.toast{
  position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--steel); color:var(--steel-ink); padding:11px 16px; border-radius:10px; font-size:13.5px;
  font-weight:600; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); z-index:70; opacity:0; transition:opacity .2s;
  pointer-events:none; max-width:92vw; text-align:center; border-left:3px solid var(--loc);
}
.toast.on{opacity:1}
@media (min-width:860px){ .toast{bottom:28px} }
.ctrlrow{margin-top:-4px; align-items:center}
.ctrlrot{flex:none; font-size:12px; font-weight:700; color:var(--muted); margin-right:2px; white-space:nowrap}
.rua[aria-pressed="true"] i{color:var(--steel-muted)}
.locgroup{margin-bottom:14px}
.locgroup > h3{
  margin:0 0 7px; font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.06em;
  background:var(--steel); color:var(--loc); border-left:3px solid var(--loc);
  border-radius:0 6px 6px 0; padding:7px 11px; display:flex; justify-content:space-between;
  align-items:center;
}
.locgroup > h3 span{font-family:var(--sans); font-size:11px; font-weight:500; color:var(--steel-muted); letter-spacing:0}
.locgroup > h3 .dir{display:flex; align-items:center; gap:9px}
.imp1{
  border:1px solid rgba(255,255,255,.2); background:transparent; color:var(--steel-muted);
  border-radius:6px; width:30px; height:27px; display:grid; place-items:center; padding:0;
  transition:color .12s, border-color .12s;
}
.imp1:hover{color:var(--loc); border-color:var(--loc)}
.btn svg{vertical-align:-2px; margin-right:7px}
#area-impressao{display:none}
.modos-inv{margin-bottom:8px}
.filinv{align-items:center; margin-bottom:12px}
.filters:empty{display:none}
.ordens{align-items:center}
.inv-escolha p{margin:0 0 10px; font-size:14px}
.flag.neg{background:var(--alert); color:#fff}
.inv-op{display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap}
.inv-op .btn{flex:1 1 220px}
.inv-op label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);
  font-weight:600; cursor:pointer; user-select:none}
.inv-op input{width:19px; height:19px; accent-color:var(--act); cursor:pointer}
.dica{font-size:12.5px; color:var(--muted); margin:-4px 2px 12px; line-height:1.45}
.locgroup.semloc > h3{background:var(--alert-soft); color:var(--alert); border-left-color:var(--alert)}
.locgroup.semloc > h3 span{color:var(--alert)}
.nfgroup{margin-bottom:14px}
.nfgroup > h3{
  margin:0 0 7px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--act);
  border-radius:0 7px 7px 0; padding:8px 11px; font-size:13px; font-weight:600;
}
.nfgroup.velho > h3{border-left-color:var(--alert)}
.nfgroup > h3 .nf{font-family:var(--mono); letter-spacing:.03em; white-space:nowrap}
.nfgroup > h3 .dir{font-size:11.5px; font-weight:500; color:var(--muted); text-align:right; line-height:1.35}
.nfgroup > h3 .dir b{color:var(--alert); font-weight:700}
.nfgroup .card{margin-bottom:6px}
.locgroup .list,.locgroup .card{margin-bottom:6px}

/* ============ separacao ============ */
.sep{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--loc-edge);
  border-radius:10px; padding:11px 13px; margin-bottom:7px; display:flex; gap:11px;
  align-items:flex-start; box-shadow:var(--shadow);
}
.sep .info{flex:1; min-width:0}
.sep .l3{margin-top:3px}
.sep .chk{width:21px; height:21px; flex:none; margin-top:3px; accent-color:var(--act)}
.sep .x{border:none; background:none; color:var(--muted); font-size:16px; line-height:1; padding:3px 4px; border-radius:5px}
.sep .x:hover{color:var(--alert); background:var(--alert-soft)}
.sep.done{border-left-color:var(--line-2)}
.sep.done .info{opacity:.42}
.sep.done .desc{text-decoration:line-through}
.qtyin{
  width:72px; padding:7px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface-2); font-family:var(--mono); font-weight:600; text-align:center; font-size:16px;
}
.qtyin:focus{border-color:var(--act); outline:none}
.obsin{
  display:block; width:100%; margin-top:9px; padding:9px 11px;
  border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.35;
}
.obsin::placeholder{color:var(--muted)}
.obsin:focus{border-color:var(--act); outline:none; background:var(--surface)}
@media (min-width:860px){ .obsin{font-size:14px} }
.so-imprime{display:none}

.rodape{
  text-align:center; color:var(--muted); font-size:11px; font-family:var(--mono);
  margin:18px 2px 4px; letter-spacing:.02em; opacity:.8;
}
.empty{
  text-align:center; color:var(--muted); padding:44px 20px; font-size:13.5px; line-height:1.6;
  border:1px dashed var(--line-2); border-radius:11px; margin:0;
}
.empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px; font-weight:600}

/* ============ desktop ============ */
@media (min-width:860px){
  .top{padding:11px 22px 12px}
  .brandrow{gap:16px; margin-bottom:0}
  .brand{font-size:16px; flex:none}
  .searchwrap{flex:1; max-width:460px}
  #q{padding:9px 38px 9px 36px; font-size:14.5px}
  .filters{margin-top:10px}
  .tabs{
    position:static; grid-template-columns:none; grid-auto-flow:column; justify-content:start;
    gap:2px; border-top:none; background:none; margin-left:auto; padding:0;
  }
  .tab{
    flex-direction:row; gap:7px; font-size:13px; padding:8px 13px; border-radius:7px;
    font-weight:500;
  }
  .tab::before{top:auto; bottom:2px; left:13px; right:13px}
  .tab:hover{color:var(--steel-ink)}
  .tab[aria-selected="true"]{background:rgba(255,255,255,.08); color:var(--loc); font-weight:600}
  .tab .n{position:static; padding:1px 6px}
  main{
    padding:18px 22px 40px; display:grid; gap:20px; align-items:start;
    grid-template-columns:minmax(340px,1.05fr) minmax(360px,.95fr); max-width:1340px; margin:0 auto;
  }
  main.single{grid-template-columns:1fr; max-width:920px}
  .panel{
    position:sticky; top:calc(var(--top-h,116px) + 18px); inset:auto; transform:none;
    visibility:visible; background:none; max-height:calc(100vh - var(--top-h,116px) - 36px);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .panel .phead{padding-top:13px; border-radius:11px 11px 0 0}
  .panel .phead .iconbtn{display:none}
  .pbody{padding:13px}
  main.single .col2{
    position:fixed; inset:0; z-index:60; display:grid; place-items:center;
    background:rgba(7,13,17,.55); visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .15s;
  }
  main.single .col2:not(.on) .panel{visibility:hidden}
  main.single .col2.on{visibility:visible; opacity:1; pointer-events:auto}
  main.single .panel{position:relative; top:auto; width:min(580px,92vw); max-height:86vh}
  main.single .panel .phead .iconbtn{display:grid}
  .ruas{flex-wrap:wrap; overflow:visible}
  .card{padding:12px 14px}
}
@media (max-width:859px){
  main{display:block}
  body.locked{overflow:hidden}
  .brand span{display:none}
}

/* ============ impressao ============ */
@media print{
  .top,.tabs,.btnrow,.sep .x,.sep .chk,.count,.rodape,.toast,.att{display:none !important}
  .qtyin,.obsin{display:none !important}
  .so-imprime{display:block}
  .so-imprime.qtd{display:inline-block; margin-left:auto; font-family:var(--mono);
    font-weight:700; font-size:13pt; border:1.5px solid #000; padding:2px 10px}
  .so-imprime.obs{margin-top:6px; font-size:11pt; padding-left:9px; border-left:3px solid #000}
  .so-imprime.obs:empty{display:none}

  /* folha de enderecos: so ela aparece */
  body.imprimindo > *:not(#area-impressao){display:none !important}
  body.imprimindo #area-impressao{display:block}
  #area-impressao .ph{display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:5px; font-size:13pt}
  #area-impressao .ph span{font-size:10pt}
  #area-impressao .pinfo{margin:0 0 16px; font-size:9.5pt; color:#333}
  #area-impressao .pg{break-inside:avoid; margin-bottom:18px}
  #area-impressao h2{font-family:var(--mono); font-size:15pt; margin:0 0 6px; padding:3px 10px;
    border:2px solid #000; display:inline-block; letter-spacing:.06em}
  #area-impressao table{width:100%; border-collapse:collapse; font-size:9.5pt; table-layout:fixed}
  #area-impressao th:nth-child(1){width:14%}
  #area-impressao th:nth-child(3){width:11%}
  #area-impressao th:nth-child(4){width:7%}
  #area-impressao th:nth-child(5){width:10%}
  #area-impressao th:nth-child(6){width:15%}
  #area-impressao th{text-align:left; font-size:8pt; border-bottom:1.5px solid #000; padding:4px 6px}
  #area-impressao td{border-bottom:1px solid #bbb; padding:7px 6px; vertical-align:top}
  #area-impressao .m{font-family:var(--mono); white-space:nowrap}
  #area-impressao .n{text-align:right}
  #area-impressao .conta{display:inline-block; width:64px; border-bottom:1px solid #000; height:13px}
  #area-impressao .conta.larga{width:100%}
  #area-impressao .pnf{font-size:9.5pt; margin-left:10px; color:#333}
  #area-impressao .t-pend th:nth-child(1){width:14%}
  #area-impressao .t-pend th:nth-child(3){width:8%}
  #area-impressao .t-pend th:nth-child(4){width:13%}
  #area-impressao .t-pend th:nth-child(5){width:18%}
  #area-impressao .t-inv th:nth-child(n){width:auto}
  #area-impressao .t-inv th.c-cod{width:14%}
  #area-impressao .t-inv th.c-arm{width:6%}
  #area-impressao .t-inv th.c-un{width:6%}
  #area-impressao .t-inv th.c-end{width:13%}
  #area-impressao .t-inv th.c-saiu{width:8%}
  #area-impressao .t-inv th.c-sis{width:10%}
  #area-impressao .t-inv th.c-cont{width:15%}
  #area-impressao .assina{margin-top:28px; display:flex; gap:40px; font-size:10pt; break-inside:avoid}
  #area-impressao .assina span{flex:1; border-top:1px solid #000; padding-top:4px}
  body{background:#fff; color:#000; font-size:11pt}
  main{padding:0; display:block}
  .panel{display:none}
  .sep{
    border:none; border-bottom:1px solid #999; border-radius:0; box-shadow:none;
    padding:7px 0; break-inside:avoid;
  }
  .loc{background:#fff; border:1.5px solid #000; color:#000; border-radius:0; box-shadow:none}
  .flag,.arm{border:1px solid #bbb; background:#fff; color:#333}
  .print-head{display:flex !important; justify-content:space-between; align-items:baseline;
    margin-bottom:14px; border-bottom:2px solid #000; padding-bottom:6px}
}
.print-head{display:none}


/* ================================================================
   Atualização visual: a lista vira uma lista de separação.
   Linhas numa superfície só,placas de corredor por endereço,e a
   etiqueta de prateleira como o elemento que marca o app.
   ================================================================ */
:root{ --trilho:#2A2614; }

/* a marca: uma etiqueta de prateleira em miniatura */
.brand::before{
  content:''; display:inline-block; width:11px; height:15px; margin-right:9px; vertical-align:-2px;
  background:var(--loc); border-left:4px solid var(--trilho); border-radius:2px;
}

/* resumo: números em fonte normal,alinhados */
.count span:last-child{font-family:var(--sans); font-weight:600; font-variant-numeric:tabular-nums}

/* produtos em linhas,separadas por um fio */
.rows{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.rows > * + *{border-top:1px solid var(--line)}
.linha-sel{gap:0; background:var(--surface)}
.marca{width:46px; border:0; border-radius:0; background:transparent}
.marca:hover{background:var(--surface-2)}
.linha-sel.on{background:var(--act-soft)}
.linha-sel.on .marca{background:transparent}
.linha-sel .card,.rows > .card,.locgroup > .card{
  border:0; border-radius:0; box-shadow:none; background:transparent; padding:12px 14px;
}
.linha-sel .card{padding-left:2px}
.linha-sel.on .card{box-shadow:none}
.linha-sel .card:hover,.rows > .card:hover,.locgroup > .card:hover{background:var(--surface-2)}
.card:active{transform:none}
.linha-sel .card:active,.rows > .card:active,.locgroup > .card:active{background:var(--line)}
/* avisos: um traço à esquerda da linha,em vez de uma borda em cada cartão */
.linha-sel .card.aviso,.rows > .card.aviso,.locgroup > .card.aviso{box-shadow:inset 3px 0 0 var(--alert)}
.linha-sel .card.zero,.rows > .card.zero{background:transparent}
.linha-sel .card.zero .desc{color:var(--muted)}

/* endereço: a placa do corredor em cima,os itens embaixo,numa peça só */
.locgroup{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px}
.locgroup > h3{margin:0; border-radius:0; border-left:0; padding:9px 10px 9px 14px; font-size:15px}
.locgroup > .card{border-top:1px solid var(--line)}
.locgroup > h3 + .card{border-top:0}

/* a etiqueta de prateleira: amarela,com o trilho escuro do porta-etiqueta */
.loc{
  font-size:13.5px; letter-spacing:.06em; padding:4px 9px 4px 8px; border-radius:3px;
  border-left:5px solid var(--trilho); box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);
}
.loc.none{border-left-width:1px}

/* quantidade: número grande,de leitura rápida */
.qty b{font-family:var(--sans); font-size:22px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.qty small{font-weight:500}
.desc{margin-bottom:8px}

/* enquanto a base carrega: o esqueleto da lista,sem animação */
.carregando .esq{height:84px; padding:14px; display:flex; flex-direction:column; gap:8px}
.carregando .esq i{display:block; height:11px; border-radius:3px; background:var(--surface-2)}
.carregando .esq i:nth-child(1){width:28%}
.carregando .esq i:nth-child(2){width:72%; height:14px}
.carregando .esq i:nth-child(3){width:22%; height:20px; background:var(--loc); opacity:.35}
.carregando p{text-align:center; color:var(--muted); font-size:13px; margin:14px 0}
.sentinela{height:1px}
.semrede{background:var(--alert-soft); color:var(--alert); border:1px solid var(--alert); border-radius:10px;
  padding:9px 12px; font-size:13px; margin-bottom:10px; line-height:1.4}
.semrede[hidden]{display:none}
.instalar{display:flex; flex-direction:column; align-items:center; gap:6px; margin:6px 0 10px}
.instalar[hidden]{display:none}
.instalar button{border:1px solid var(--act); background:transparent; color:var(--act); border-radius:9px;
  padding:9px 14px; font-weight:600; font-size:13.5px}
.instalar button[hidden]{display:none}
.instalar p{margin:0; font-size:12px; color:var(--muted); text-align:center; max-width:320px}
@media print{ .semrede,.instalar{display:none !important} }

/* pendentes: a nota fiscal é a placa,os itens dela embaixo,numa peça só */
.nfgroup{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:12px}
.nfgroup > h3{margin:0; border:0; border-radius:0; border-left:4px solid var(--act); border-bottom:1px solid var(--line);
  background:var(--surface-2); padding:9px 12px}
.nfgroup.velho > h3{border-left-color:var(--alert)}
.nfgroup > .card{border:0; border-radius:0; box-shadow:none; background:transparent; margin:0; padding:10px 14px}
.nfgroup > .card + .card{border-top:1px solid var(--line)}
.nfgroup > .card:hover{background:var(--surface-2)}
.nfgroup > .card.aviso{box-shadow:inset 3px 0 0 var(--alert)}

/* separação: as linhas formam uma lista contínua */
.sep{border-left:0; border-radius:0; box-shadow:none; margin-bottom:0; border-bottom-width:0}
.btnrow + .sep{border-top-left-radius:12px; border-top-right-radius:12px; margin-top:4px}
.sep:last-of-type{border-bottom-left-radius:12px; border-bottom-right-radius:12px; border-bottom-width:1px}
.sep.done{background:var(--surface-2)}

/* computador: o nome do app encolhe (com reticências) para as abas e botões sempre caberem */
@media (min-width:860px){
  .brand{flex:0 1 auto; min-width:150px}
  .brandrow > .tabs, .brandrow > .iconbtn{flex:none}
}
/* telas médias (notebook pequeno, tablet deitado): abas compactas,sem ícone */
@media (min-width:860px) and (max-width:1099px){
  .brandrow{gap:10px}
  .brand{min-width:100px}
  .brand span{display:none}
  .tab svg{display:none}
  .tab{padding-left:10px; padding-right:10px}
}

/* linhas mais enxutas: cabe mais produto por tela */
.linha-sel .card,.rows > .card,.locgroup > .card{padding:10px 14px}
.linha-sel .card{padding-left:2px}
.linha-sel .card .l1,.rows > .card .l1,.locgroup > .card .l1{margin-bottom:2px}
.linha-sel .card .desc,.rows > .card .desc,.locgroup > .card .desc{margin-bottom:7px}
@media (max-width:520px){ .dica-sel{display:none} }

/* tema escuro: o trilho da etiqueta precisa aparecer no fundo escuro */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --trilho:#5C5220; } }
:root[data-theme="dark"]{ --trilho:#5C5220; }

/* ---------- atualizar a base ---------- */
.att{position:fixed; inset:0; z-index:70; background:rgba(8,14,18,.55); display:flex; align-items:flex-end; justify-content:center}
.att[hidden]{display:none}
.att-caixa{background:var(--bg); width:100%; max-height:100%; overflow:auto; display:flex; flex-direction:column;
  border-radius:14px 14px 0 0; padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){ .att{align-items:center} .att-caixa{width:560px; max-height:88vh; border-radius:14px; box-shadow:0 30px 70px -20px rgba(0,0,0,.6)} }

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('dados').textContent);
var FIL = D.filiais, DESCS = D.descs;
var EPOCH = Date.UTC(2000,0,1), HOJE = Math.floor((Date.now()-EPOCH)/864e5);
var SEMSB2 = D.semSB2 || [];
var SEM_CUSTOS = D.semCustos === true;
function semSaldoFisico(f){ return SEMSB2.indexOf(FIL[f])>=0; }

/* ---------- utilidades ---------- */
function norm(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
function nq(n){ if(!n) return '0'; return n.toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function nm(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2}); }
function data(n){ if(!n) return '—'; var d=new Date(EPOCH+n*864e5);
  return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
function plural(n,s,p){ return n===1 ? s : p; }
function copiarTexto(texto){
  /* A área de transferência moderna só funciona em https ou localhost.
     Pelo IP da rede o navegador bloqueia, então cai no plano B. */
  if(navigator.clipboard && window.isSecureContext){
    try{ return navigator.clipboard.writeText(texto); }catch(e){}
  }
  return new Promise(function(deuCerto, falhou){
    try{
      var area = document.createElement('textarea');
      area.value = texto;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '0';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, texto.length);
      var foi = document.execCommand('copy');
      document.body.removeChild(area);
      foi ? deuCerto() : falhou();
    }catch(erro){ falhou(erro); }
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function el(h){ var t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem('estq_'+k)); localStorage.setItem('estq_'+k, JSON.stringify(v)); }catch(e){ return null; } }

/* ---------- montagem dos itens ---------- */
var ITENS = [], PORLOC = {}, ID = 0;
function addItem(f, c, d, rows){
  var saldo=0, emp=0, valor=0, prev=0, aend=0, ultS=0, ultM=0, ends=[], somaEnd=0, arms=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    saldo+=r[1]; emp+=r[2]; valor+=r[1]*r[3]; prev+=r[4]; aend+=r[5];
    if(r[6]>ultS) ultS=r[6]; if(r[7]>ultM) ultM=r[7];
    arms.push(r[0]);
    for(var j=0;j<r[9].length;j++){
      var e=r[9][j]; ends.push({e:e[0], q:e[1], emp:e[2], arm:r[0]}); somaEnd+=e[1];
    }
  }
  ends.sort(function(a,b){ return b.q-a.q; });
  var it={ id:ID++, f:f, c:c, d:d, rows:rows, saldo:saldo, emp:emp, disp:saldo-emp, valor:valor,
    prev:prev, aend:aend, ultS:ultS, ultM:ultM, ends:ends, somaEnd:somaEnd, arms:arms,
    div: ends.length>0 && Math.abs(somaEnd-saldo)>0.001 && SEMSB2.indexOf(FIL[f])<0,
    semEnd: saldo>0 && ends.length===0,
    idx: c+' '+norm(d) };
  ITENS.push(it);
  for(var k=0;k<ends.length;k++){
    (PORLOC[ends[k].e] = PORLOC[ends[k].e] || []).push({it:it, q:ends[k].q, arm:ends[k].arm});
  }
  return it;
}
function lerControle(v){ return v === 1 ? true : v === 0 ? false : null; }
D.ativos.forEach(function(a){
  var it = addItem(a.f, a.c, DESCS[a.d]||'(sem descrição)', a.r);
  it.ctrl = lerControle(a.e);
});
ITENS.forEach(function(it){
  if(it.ctrl === false && it.semEnd){ it.semEnd = false; it.naoCtrl = true; }
});
var MAPA = {};
ITENS.forEach(function(it){ MAPA[it.f + '|' + it.c] = it; });

/* Os ~40 mil produtos sem saldo não aparecem na tela inicial ("Só com saldo").
   São montados depois da primeira lista, em segundo plano. Quem precisar deles
   antes disso chama garantirZerados(), que termina na hora. */
var ZER = {feito: 0, ok: !D.zerados.length};
function zeradosPedaco(n){
  var fim = Math.min(D.zerados.length, ZER.feito + n);
  for(; ZER.feito < fim; ZER.feito++){
    var z = D.zerados[ZER.feito];
    var it = addItem(z[0], z[1], DESCS[z[2]]||'(sem descrição)', []);
    it.ultS = z[3]; it.zero = true; it.ctrl = lerControle(z[4]);
    MAPA[it.f + '|' + it.c] = it;
  }
  if(ZER.feito >= D.zerados.length) ZER.ok = true;
}
function garantirZerados(){ if(!ZER.ok) zeradosPedaco(D.zerados.length); }
function zeradosEmSegundoPlano(){
  if(ZER.ok) return;
  zeradosPedaco(2500);
  if(!ZER.ok) setTimeout(zeradosEmSegundoPlano, 16);
}
var LOCS = Object.keys(PORLOC).sort();
LOCS.forEach(function(L){ PORLOC[L].sort(function(a,b){ return b.q-a.q; }); });
var RUAS = {};
LOCS.forEach(function(L){ var r=L.split('-')[0]; (RUAS[r]=RUAS[r]||[]).push(L); });
var RUAKEYS = Object.keys(RUAS).sort(function(a,b){
  var ca = /^[A-Z]\d{2}$/.test(a) ? 0 : 1, cb = /^[A-Z]\d{2}$/.test(b) ? 0 : 1;
  return ca!==cb ? ca-cb : (a<b?-1:a>b?1:0);
});

/* ---------- estado ---------- */
var S = {
  tab:'prod', q:'', fil: store('fil') || '', comSaldo: store('comSaldo')!==false,
  sel:null, rua:null, ctrl:null, selec:{}, invDia:null, invTipo:null, cega:false, invModo:'rotativo', invOrdem:'endereco', invArm:'', invFils:null, sep: store('sep') || []
};

/* ---------- filtros ---------- */
var elFiltros = document.getElementById('filtros');
function renderFiltros(){
  if(S.tab === 'inv'){ elFiltros.innerHTML = ''; medirTopo(); return; }   // no Inventário a escolha é na própria aba
  var h = '<button class="chip" data-f="" aria-pressed="'+(S.fil===''?'true':'false')+'">Todas as filiais</button>';
  FIL.forEach(function(f){
    h += '<button class="chip" data-f="'+f+'" aria-pressed="'+(S.fil===f?'true':'false')+'">'+f+'</button>';
  });
  if(S.tab==='prod') h += '<button class="chip" id="cs" aria-pressed="'+(S.comSaldo?'true':'false')+'">Só com saldo</button>';
  elFiltros.innerHTML = h;
  if(typeof medirTopo === 'function') medirTopo();
}
elFiltros.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id==='cs'){ S.comSaldo=!S.comSaldo; store('comSaldo',S.comSaldo); }
  else { S.fil = b.dataset.f; store('fil', S.fil); }
  renderFiltros(); render();
});

/* ---------- busca ---------- */
var elQ = document.getElementById('q'), elClear = document.getElementById('clearq'), tmr;
elQ.addEventListener('input', function(){
  elClear.classList.toggle('on', elQ.value.length>0);
  clearTimeout(tmr); tmr = setTimeout(function(){ S.q = norm(elQ.value.trim()); render(); }, 130);
});
elClear.addEventListener('click', function(){ elQ.value=''; S.q=''; elClear.classList.remove('on'); elQ.focus(); render(); });

function buscar(){
  if(!S.comSaldo) garantirZerados();
  var q = S.q, fil = S.fil, cs = S.comSaldo, out = [], termos = q ? q.split(/\s+/) : [];
  for(var i=0;i<ITENS.length;i++){
    var it = ITENS[i];
    if(fil && FIL[it.f]!==fil) continue;
    if(cs && it.saldo<=0) continue;
    if(termos.length){
      var ok=true;
      for(var t=0;t<termos.length;t++){ if(it.idx.indexOf(termos[t])<0){ ok=false; break; } }
      if(!ok){
        var achouLoc=false;
        for(var e=0;e<it.ends.length && !achouLoc;e++){ if(it.ends[e].e.indexOf(q)===0) achouLoc=true; }
        if(!achouLoc) continue;
      }
    }
    out.push(it);
  }
  out.sort(function(a,b){
    if((b.saldo>0)-(a.saldo>0)) return (b.saldo>0)-(a.saldo>0);
    if(q){
      var ax = a.c.indexOf(q)===0?0:1, bx = b.c.indexOf(q)===0?0:1;
      if(ax!==bx) return ax-bx;
    }
    return a.c < b.c ? -1 : a.c > b.c ? 1 : a.f-b.f;
  });
  return out;
}

/* ---------- cartões ---------- */
function catControle(it){ return it.ctrl === true ? 'sim' : it.ctrl === false ? 'nao' : 'sem'; }

function chipsControle(cont){
  var ops = [['', 'Todos', cont.sim + cont.nao + cont.sem],
             ['sim', 'Sim', cont.sim],
             ['nao', 'Nao', cont.nao],
             ['sem', 'Fora da SBZ', cont.sem]];
  var h = '<div class="ruas ctrlrow"><span class="ctrlrot">Contr. Endereço</span>';
  ops.forEach(function(o){
    if(o[0] === 'sem' && !o[2] && S.ctrl !== 'sem') return;   // so aparece se existir
    h += '<button class="rua txt" data-ctrl="' + o[0] + '" aria-pressed="' +
         ((S.ctrl || '') === o[0] ? 'true' : 'false') + '">' + o[1] +
         '<i>' + o[2].toLocaleString('pt-BR') + '</i></button>';
  });
  return h + '</div>';
}

function mostrarEscolhido(){
  var linha = lista.querySelector('.ctrlrow'), ativo = linha && linha.querySelector('[aria-pressed="true"]');
  if(ativo && ativo.offsetLeft + ativo.offsetWidth > linha.clientWidth) linha.scrollLeft = ativo.offsetLeft - 14;
}

function etiquetaControle(it){
  if(it.ctrl === true)  return '<span class="flag ctrl" title="Campo Contr.Endere da SBZ">Contr. Endereço: Sim</span>';
  if(it.ctrl === false) return '<span class="flag nctrl" title="Campo Contr.Endere da SBZ">Contr. Endereço: Nao</span>';
  return '<span class="flag sctrl" title="Produto sem registro na SBZ">Contr. Endereço: fora da SBZ</span>';
}

function cardHTML(it){
  var loc;
  if(it.ends.length===0) loc = it.saldo<=0 ? ''
    : it.naoCtrl ? '<span class="flag nctrl">Contr. Endereço: Nao</span>'
    : '<span class="loc none">sem endereço</span>';

/* ---------- listas longas: desenha o que cabe na tela e o resto conforme a rolagem ---------- */
var progObs = null;
function pararProgressivo(){ if(progObs){ progObs.disconnect(); progObs = null; } }
function progressivo(alvo, partes, primeiro, passo, montar){
  // montar(item) gera o HTML de cada item só quando ele vai ser desenhado
  pararProgressivo();
  var i = 0;
  var lote = function(n){
    var fim = Math.min(partes.length, i + n);
    if(fim > i) alvo.insertAdjacentHTML('beforeend', (montar ? partes.slice(i, fim).map(montar) : partes.slice(i, fim)).join(''));
    i = fim;
  };
  lote(primeiro);
  if(i >= partes.length) return;
  if(!('IntersectionObserver' in window)){ lote(partes.length); return; }
  var sent = document.createElement('div');
  sent.className = 'sentinela';
  alvo.parentNode.insertBefore(sent, alvo.nextSibling);
  var obs = progObs = new IntersectionObserver(function(ents){
    if(!ents[0].isIntersecting) return;
    lote(passo);
    obs.unobserve(sent);
    if(i >= partes.length){ obs.disconnect(); if(progObs === obs) progObs = null; sent.remove(); }
    else obs.observe(sent);   // observar de novo dispara outra checagem, se ainda estiver à vista
  }, {rootMargin: '900px 0px'});
  obs.observe(sent);
}

function haQuanto(dia){

  var n = HOJE - dia;
  if(n <= 0) return 'hoje';
  if(n === 1) return 'ontem';
  return 'há ' + n + ' dias';

function montarPendentes(){
  var P = D.pendentes || [], termos = S.q ? S.q.split(/\s+/) : [];
  var grupos = [], porNota = {};
  P.forEach(function(p){
    if(S.fil && FIL[p[0]] !== S.fil) return;
    var desc = DESCS[p[2]] || '';
    if(termos.length){
      var alvo = p[1] + ' ' + p[6] + ' ' + norm(desc);
      for(var i=0;i<termos.length;i++) if(alvo.indexOf(termos[i]) < 0) return;
    }
    var it = itemDe(p[0], p[1]);
    var l = {f:p[0], c:p[1], d:desc, a:p[3], saldo:p[4], ori:p[5], doc:p[6], dia:p[7], it:it,
             sug: it && it.ends.length ? it.ends[0].e : '', mais: it ? Math.max(0, it.ends.length-1) : 0};
    var k = l.f + '|' + l.doc;
    if(!porNota[k]){ porNota[k] = {f:l.f, doc:l.doc, dia:l.dia, its:[]}; grupos.push(porNota[k]); }
    porNota[k].its.push(l);
    if(l.dia && (!porNota[k].dia || l.dia < porNota[k].dia)) porNota[k].dia = l.dia;
  });
  grupos.sort(function(a,b){ return (a.dia||99999) - (b.dia||99999) || (a.doc < b.doc ? -1 : 1); });
  return grupos;
}

var ULTIMOS_INV = [], CHAVE_SEM = '\u0000sem';

function diaCurto(n){
  if(!n) return 'sem data';
  if(n === HOJE) return 'hoje';
  if(n === HOJE - 1) return 'ontem';
  var d = new Date(EPOCH + n*864e5);
  return String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0');
}

function montarInventario(){
  var M = D.movimentos || [];
  var dias = [];
  M.forEach(function(m){ if(dias.indexOf(m[7]) < 0) dias.push(m[7]); });
  dias.sort(function(a,b){ return b-a; });
  if(S.invDia === null) S.invDia = dias.length ? dias[0] : 'todos';

  var termos = S.q ? S.q.split(/\s+/) : [];
  var linhas = {}, ordem = [], tipos = {};
  M.forEach(function(m){
    if(S.invDia !== 'todos' && m[7] !== S.invDia) return;
    if(!invFilOk(FIL[m[0]])) return;
    if(m[10]) (tipos[m[10]] = tipos[m[10]] || {})[m[0] + '|' + m[1]] = 1;
    if(S.invTipo && m[10] !== S.invTipo) return;

    var it = itemDe(m[0], m[1]);
    var desc = DESCS[m[2]] || (it ? it.d : '');
    // a SD3 traz o endereco de onde saiu; sem ele (relacao antiga), usa os enderecos do saldo
    var locais = m[9] ? [{e:m[9], arm:m[8] || ''}]
      : (it && it.ends.length ? it.ends.map(function(x){ return {e:x.e, arm:x.arm}; })
                              : [{e:CHAVE_SEM, arm:m[8] || ''}]);
    if(termos.length){
      var alvo = m[1] + ' ' + norm(desc) + ' ' + norm(m[12] || '') + ' ' + norm(m[6] || '') + ' ' +
                 locais.map(function(x){ return x.e; }).join(' ');
      for(var i=0;i<termos.length;i++) if(alvo.indexOf(termos[i]) < 0) return;
    }
    var tm = parseInt(m[4], 10), saida = isNaN(tm) || tm > 500;
    locais.forEach(function(x){
      var k = m[0] + '|' + x.arm + '|' + x.e + '|' + m[1];
      if(!linhas[k]){
        var sis = null;
        if(it && x.e !== CHAVE_SEM){
          it.ends.forEach(function(en){
            if(en.e === x.e && (!x.arm || en.arm === x.arm)) sis = (sis || 0) + en.q;
          });
        }
        linhas[k] = {f:m[0], arm:x.arm, L:x.e, p:{c:m[1], d:desc, it:it}, saiu:0, entrou:0,
                     un:m[11] || '', destinos:[], sis:sis, n:locais.length};
        ordem.push(k);
      }
      var l = linhas[k];
      if(saida) l.saiu += m[3]; else l.entrou += m[3];
      if(m[12] && l.destinos.indexOf(m[12]) < 0) l.destinos.push(m[12]);
    });
  });

  var grupos = {}, lista_g = [], prods = {};
  ordem.forEach(function(k){
    var l = linhas[k], gk = l.f + '|' + l.arm + '|' + l.L;
    if(!grupos[gk]){ grupos[gk] = {k:gk, f:l.f, arm:l.arm, L:l.L, its:[]}; lista_g.push(grupos[gk]); }
    grupos[gk].its.push(l);
    prods[l.f + '|' + l.p.c] = 1;
  });
  lista_g.sort(function(a,b){
    var sa = a.L === CHAVE_SEM ? 1 : 0, sb = b.L === CHAVE_SEM ? 1 : 0;
    return sa - sb || a.f - b.f || (a.arm < b.arm ? -1 : a.arm > b.arm ? 1 : 0) ||
           (a.L < b.L ? -1 : a.L > b.L ? 1 : 0);
  });
  var contTipos = {};
  Object.keys(tipos).forEach(function(t){ contTipos[t] = Object.keys(tipos[t]).length; });
  return {dias:dias, tipos:contTipos, produtos:Object.keys(prods).length, grupos:lista_g};
}

function invFilOk(f){ return !S.invFils.length || S.invFils.indexOf(f) >= 0; }

function montarCompleto(){
  var termos = S.q ? S.q.split(/\s+/) : [], linhas = [], arms = {}, prods = {}, ends = {}, valor = 0, custo = 0;
  ITENS.forEach(function(it){
    if(S.invFils.indexOf(FIL[it.f]) < 0 || it.zero) return;
    var semSb2 = SEMSB2.indexOf(FIL[it.f]) >= 0;
    // códigos "MO...": mão de obra, depreciação e GGF apropriados no Protheus. Não são material físico.
    if(/^MO|MO$/.test(it.c)){ custo++; return; }
    var ls = [];
    it.rows.forEach(function(r){
      var arm = r[0], soma = 0;
      r[9].forEach(function(e){ if(e[1] > 0){ ls.push({it: it, L: e[0], arm: arm, q: e[1]}); soma += e[1]; } });
      var resto = r[1] - soma;
      if(semSb2) return;
      // saldo do armazém maior que a soma dos endereços: a diferença também precisa ser contada
      if(resto > 0.0001) ls.push({it: it, L: '', arm: arm, q: resto, fora: r[9].length > 0});
      // saldo negativo sem endereço: erro de sistema que o inventário precisa resolver
      else if(r[1] < -0.0001 && !r[9].length) ls.push({it: it, L: '', arm: arm, q: r[1], neg: true});
    });
    if(!ls.length) return;
    ls.forEach(function(l){
      arms[l.arm] = 1;
      if(S.invArm && l.arm !== S.invArm) return;
      if(termos.length){
        var alvo = it.idx + ' ' + norm(l.L);
        for(var i = 0; i < termos.length; i++) if(alvo.indexOf(termos[i]) < 0) return;
      }
      linhas.push(l);
      if(!prods[it.id]){ prods[it.id] = 1; valor += it.valor; }
      if(l.L) ends[it.f + '|' + l.L] = 1;
    });
  });
  var cod = function(a, b){ return a.it.c < b.it.c ? -1 : a.it.c > b.it.c ? 1 : 0; };
  var fil = function(a, b){ return a.it.f - b.it.f; };
  var loc = function(a, b){ return (a.L ? 0 : 1) - (b.L ? 0 : 1) || (a.L < b.L ? -1 : a.L > b.L ? 1 : 0); };
  var ordem = S.invOrdem || 'endereco';
  linhas.sort(
    ordem === 'codigo'    ? function(a, b){ return cod(a, b) || fil(a, b) || (a.arm < b.arm ? -1 : a.arm > b.arm ? 1 : 0) || loc(a, b); } :
    ordem === 'descricao' ? function(a, b){
      var sa = a.it.d.indexOf('(sem') === 0 ? 1 : 0, sb = b.it.d.indexOf('(sem') === 0 ? 1 : 0;
      return sa - sb || a.it.d.localeCompare(b.it.d, 'pt') || cod(a, b) || fil(a, b) || loc(a, b); } :
    ordem === 'armazem'   ? function(a, b){ return (a.arm < b.arm ? -1 : a.arm > b.arm ? 1 : 0) || fil(a, b) || loc(a, b) || cod(a, b); } :
                            function(a, b){ return fil(a, b) || loc(a, b) || (a.arm < b.arm ? -1 : a.arm > b.arm ? 1 : 0) || cod(a, b); });
  return {linhas: linhas, arms: Object.keys(arms).sort(), produtos: Object.keys(prods).length,
          enderecos: Object.keys(ends).length, valor: valor, ordem: ordem, custo: custo, multi: S.invFils.length > 1,
          negativos: linhas.filter(function(l){ return l.neg; }).length};
}

function chaveGrupo(l){ return l.it.f + '|' + (l.L || CHAVE_SEM); }
function agruparPorEndereco(linhas){
  var grupos = [], porK = {};
  linhas.forEach(function(l){
    var k = chaveGrupo(l);
    if(!porK[k]){ porK[k] = {k: k, f: l.it.f, L: l.L || CHAVE_SEM, its: []}; grupos.push(porK[k]); }
    porK[k].its.push(l);
  });
  return grupos;
}

    'arm ' + esc(l.arm) + '</span></div>' +
    '<p class="desc">' + esc(it.d) + '</p><div class="l3">' +
    (mostrarEndereco ? (l.L ? '<span class="loc">' + esc(l.L) + '</span>'
                            : '<span class="loc none">' + (l.fora ? 'fora de endereço' : 'sem endereço') + '</span>') : '') +
    (sem && l.fora ? '<span class="flag">diferença do saldo</span>' : '') +
    (l.neg ? '<span class="flag neg">saldo negativo</span>' : '') +
    '<span class="qty"><b>' + nq(l.q) + '</b><small>no sistema</small></span></div></button>';

function imprimirCompleto(r, soEndereco){
  if(!r || !r.linhas.length) return;
  var linhas = soEndereco ? r.linhas.filter(function(l){ return chaveGrupo(l) === soEndereco; }) : r.linhas;
  if(!soEndereco && linhas.length > 400 &&
     !confirm('Vai imprimir ' + linhas.length.toLocaleString('pt-BR') + ' linhas, umas ' + Math.ceil(linhas.length / 30) +
              ' páginas. Continuar?')) return;
  var cega = S.cega, nomeOrdem = ORDENS_INV.filter(function(o){ return o[0] === r.ordem; })[0][1].toLowerCase();
  var titulo = 'Inventário completo · ' + (soEndereco ? 'filial ' + FIL[linhas[0].it.f] + ' · ' + linhas[0].L : invFilTexto()) +
               (S.invArm ? ' · armazém ' + S.invArm : '');
  var multi = r.multi && !soEndereco;
  var h = '<div class="ph"><b>' + esc(titulo) + '</b><span>' + new Date().toLocaleString('pt-BR') + '</span></div>';
  h += '<p class="pinfo">' + linhas.length + ' ' + plural(linhas.length, 'linha', 'linhas') + ' de contagem · ordenado por ' +
       nomeOrdem + (S.q ? ' · busca “' + esc(elQ.value) + '”' : '') + (cega ? ' · contagem cega' : '') + '</p>';
  var cabec = function(comEnd){
    return '<table class="t-inv"><thead><tr>' + (comEnd && multi ? '<th class="c-un">Filial</th>' : '') +
      (comEnd ? '<th class="c-end">Endereço</th>' : '') +
      '<th class="c-cod">Código</th><th>Descrição</th><th class="c-un">Arm</th>' +
      (cega ? '' : '<th class="c-sis n">Sistema</th>') + '<th class="c-cont n">Contado</th></tr></thead><tbody>';
  };
  var linha = function(l, comEnd){
    return '<tr>' + (comEnd && multi ? '<td class="m">' + FIL[l.it.f] + '</td>' : '') +
      (comEnd ? '<td class="m">' + (l.L ? esc(l.L) : l.neg ? 'saldo neg.' : (l.fora ? 'fora de end.' : 'sem end.')) + '</td>' : '') +
      '<td class="m">' + l.it.c + '</td><td>' + esc(l.it.d) + '</td><td class="m">' + esc(l.arm) + '</td>' +
      (cega ? '' : '<td class="n m">' + nq(l.q) + '</td>') + '<td class="n"><span class="conta"></span></td></tr>';
  };
  if(r.ordem === 'endereco'){
    agruparPorEndereco(linhas).forEach(function(g){
      var sem = g.L === CHAVE_SEM;
      h += '<section class="pg"><h2>' + (sem ? 'SEM ENDEREÇO' : esc(g.L)) + '</h2>' +
           '<span class="pnf">filial ' + FIL[g.f] + (sem ? ' · conferir no armazém' : '') + '</span>' + cabec(false);
      g.its.forEach(function(l){ h += linha(l, false); });
      h += '</tbody></table></section>';
    });
  } else {
    h += cabec(true);
    linhas.forEach(function(l){ h += linha(l, true); });
    h += '</tbody></table>';
  }
  h += '<div class="assina"><span>Contado por</span><span>Conferido por</span><span>Data</span></div>';
  document.getElementById('area-impressao').innerHTML = h;
  document.body.classList.add('imprimindo');
  window.print();
}

lista.addEventListener('click', function(e){
  var um = e.target.closest('[data-imp]');
  if(um){
    var alvo = ULTIMOS_GRUPOS.filter(function(g){ return g.L === um.dataset.imp; });
    imprimirEnderecos(alvo);
    return;
  }
  if(e.target.closest('#imp-end')){ imprimirEnderecos(ULTIMOS_GRUPOS); return; }
  if(e.target.closest('#imp-pend')){ imprimirPendentes(ULTIMOS_PEND); return; }
  if(e.target.closest('#imp-inv')){ imprimirInventario(ULTIMOS_INV); return; }
  if(e.target.closest('#imp-inv-total')){ imprimirCompleto(ULTIMO_COMPLETO); return; }
  var ic = e.target.closest('[data-impcomp]');
  if(ic){ imprimirCompleto(ULTIMO_COMPLETO, ic.dataset.impcomp); return; }
  var im = e.target.closest('[data-inv-modo]');
  if(im){ S.invModo = im.dataset.invModo; render(); return; }
  var io = e.target.closest('[data-inv-ordem]');
  if(io){ S.invOrdem = io.dataset.invOrdem; render(); return; }
  var ia = e.target.closest('[data-inv-arm]');
  if(ia){ S.invArm = ia.dataset.invArm || ''; render(); return; }
  var fi = e.target.closest('[data-inv-fil]');
  if(fi){
    var f = fi.dataset.invFil, k = S.invFils.indexOf(f);
    if(!f) S.invFils = []; else if(k >= 0) S.invFils.splice(k, 1); else S.invFils.push(f);
    S.invFils.sort(); S.invArm = '';
    render(); return;
  }
  var ui = e.target.closest('[data-impinv]');
  if(ui){ imprimirInventario(ULTIMOS_INV.filter(function(g){ return g.k === ui.dataset.impinv; })); return; }
  if(e.target.closest('#sel-separar')){ separarSelecionados(); return; }
  if(e.target.closest('#sel-limpar')){ S.selec = {}; render(); return; }
  var ct = e.target.closest('[data-ctrl]');
  if(ct){ S.ctrl = ct.dataset.ctrl || null; render(); return; }
  var tp = e.target.closest('[data-tipo]');
  if(tp){ S.invTipo = tp.dataset.tipo || null; render(); return; }
  var dd = e.target.closest('[data-dia]');
  if(dd){ S.invDia = dd.dataset.dia === 'todos' ? 'todos' : +dd.dataset.dia; render(); return; }
  var c = e.target.closest('[data-id]');
  if(c){ abrir(+c.dataset.id); return; }
  var r = e.target.closest('[data-rua]');
  if(r){ S.rua = r.dataset.rua || null; render(); return; }
  var rm = e.target.closest('[data-rm]');
  if(rm){ S.sep.splice(+rm.dataset.rm,1); store('sep',S.sep); badge(); render(); return; }
});

});

/* ======================================================================
   ATUALIZAR A BASE pelo app.
   Dois caminhos: o computador do servidor (rede da empresa, sem senha) ou o
   GitHub (de qualquer lugar, com um token salvo no aparelho). Nos dois, cada
   planilha nova substitui a antiga do mesmo tipo e das mesmas filiais, e nada
   acontece antes de você conferir e confirmar.
   ====================================================================== */
var ATT_TIPOS = {SB2: 'Saldo físico', SBF: 'Saldo por endereço', SDA: 'A endereçar',
                 SD3: 'Movimentações (SD3)', SD3R: 'Relação de movimentações', SBZ: 'Indicadores (SBZ)'};
var ATT_LEITOR = {src: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                  integridade: 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw'};
var ATT = {arqs: [], destino: '', servidor: null, repo: null, plano: null, lote: '', etapa: 'escolher',
           msg: '', resultado: null, buffers: {}, listaRepo: null};
var attJanela = document.getElementById('att'), attCorpo = document.getElementById('att-corpo');

function attRepo(){
  if(D.repo && D.repo.nome) return {nome: D.repo.nome, ramo: D.repo.ramo || ''};
  var h = location.hostname;
  if(/\.github\.io$/i.test(h)){
    var dono = h.split('.')[0], seg = location.pathname.split('/').filter(Boolean)[0];
    return {nome: dono + '/' + (seg && seg !== 'index.html' ? seg : h), ramo: ''};
  }
  return null;
}
function attAcentos(s){   // o servidor escreve sem acento (por causa da janela do Windows); aqui volta o acento
  return String(s || '').replace(/\bnao\b/g, 'não').replace(/\bso\b/g, 'só').replace(/cabecalho/g, 'cabeçalho')
    .replace(/possivel/g, 'possível').replace(/\bja\b/g, 'já').replace(/invalido/g, 'inválido');
}
function attTam(n){ return n > 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function attRotulo(a){
  return (ATT_TIPOS[a.t] || 'não reconhecida') + (a.f && a.f.length ? ' · ' + (a.f.length > 4 ? a.f.length + ' filiais' : a.f.join(', ')) : '');
}

function attAbrir(){
  attJanela.hidden = false; document.body.classList.add('locked');
  ATT.etapa = 'escolher'; ATT.plano = null; ATT.resultado = null; ATT.msg = '';
  ATT.repo = attRepo();
  attRender();
  if(location.protocol.indexOf('http') === 0){
    fetch('base/status', {cache: 'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ ATT.servidor = j && j.ok ? j : null; if(!ATT.destino) ATT.destino = ATT.servidor ? 'servidor' : (ATT.repo ? 'github' : ''); attRender(); })
      .catch(function(){ ATT.servidor = null; if(!ATT.destino && ATT.repo) ATT.destino = 'github'; attRender(); });
  }
}
function attFechar(){
  if(ATT.etapa === 'enviando' || ATT.etapa === 'conferindo') return;   // não interrompe no meio
  attJanela.hidden = true;
  if(!panel.classList.contains('open')) document.body.classList.remove('locked');
}

function attRender(){
  var h = '', e = ATT.etapa;
  if(e === 'escolher'){
    var atuais = D.arquivos || [];
    h += '<p class="att-intro">Anexe as exportações do Protheus (.xlsx). Cada planilha nova substitui a antiga ' +
         '<b>do mesmo tipo e das mesmas filiais</b>. Antes de trocar, o app mostra o que entra e o que sai.</p>';
    h += '<details class="att-atual"><summary>Base atual: ' + D.gerado.split('-').reverse().join('/') + ', ' + atuais.length + ' ' +
         plural(atuais.length, 'planilha', 'planilhas') + '</summary><ul>' + atuais.map(function(a){
           return '<li><b>' + esc(a.n) + '</b><span>' + esc(attRotulo(a)) + '</span></li>'; }).join('') + '</ul></details>';
    h += '<label class="att-solta" id="att-solta"><input type="file" id="att-arq" multiple accept=".xlsx,.xls,.xlsm">' +
         '<b>Escolher planilhas</b><span>ou arraste os arquivos para cá</span></label>';
    if(ATT.arqs.length){
      h += '<ul class="att-lista">' + ATT.arqs.map(function(a, i){
        return '<li><span class="att-nome">' + esc(a.name) + '</span><span class="att-tam">' + attTam(a.size) + '</span>' +
               '<button type="button" class="att-tirar" data-att-tirar="' + i + '" aria-label="Tirar ' + esc(a.name) + '">×</button></li>';
      }).join('') + '</ul>';
    }
    // destino
    var opcoes = [];
    if(ATT.servidor) opcoes.push(['servidor', 'Computador do servidor', 'Sem senha. O computador monta a base e publica para todos.']);

    h += '<div class="att-acoes"><button type="button" class="btn" id="att-conferir"' + (pode ? '' : ' disabled') + '>Conferir</button></div>';
  } else if(e === 'conferindo' || e === 'enviando'){

  } else if(e === 'plano'){

    h += '<div class="att-acoes"><button type="button" class="btn" id="att-ok">Fechar</button></div>';
  } else if(e === 'erro'){

/* ---------- ler as planilhas no navegador (caminho do GitHub) ---------- */
function attCarregarLeitor(){
  if(window.XLSX) return Promise.resolve();
  return new Promise(function(ok, nao){
    var s = document.createElement('script');
    s.src = ATT_LEITOR.src; s.integrity = ATT_LEITOR.integridade; s.crossOrigin = 'anonymous';
    s.onload = ok;
    s.onerror = function(){ nao(new Error('Não consegui carregar o leitor de planilhas. Confira a internet e tente de novo.')); };
    document.head.appendChild(s);
  });
}
function attTipoPorColunas(c){   // a mesma regra, na mesma ordem, do build.py
  var tem = function(l){ return l.every(function(x){ return c.indexOf(x) >= 0; }); };
  if(tem(['Endereco', 'Prioridade', 'Quantidade'])) return 'SBF';
  if(tem(['Saldo Atual', 'Nome Cientif'])) return 'SB2';
  if(tem(['Qtd Original', 'Saldo', 'Documento'])) return 'SDA';
  if(tem(['Contr.Endere', 'Codigo'])) return 'SBZ';
  if(tem(['TP Movimento', 'Endereco', 'Quantidade'])) return 'SD3';
  if(tem(['TP Movimento', 'Qtd. Saida'])) return 'SD3R';
  return null;
}
function attAnalisar(nome, buf){
  var wb = XLSX.read(buf, {type: 'array', dense: true});
  var linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: null, blankrows: true});
  var cab = -1;
  for(var i = 0; i < Math.min(15, linhas.length); i++){
    var v = (linhas[i] || []).filter(function(x){ return x !== null && x !== undefined; }).map(function(x){ return String(x).trim(); });
    if(v.indexOf('Filial') >= 0 && (v.indexOf('Produto') >= 0 || v.indexOf('Codigo') >= 0)){ cab = i; break; }
  }
  if(cab < 0) return {n: nome, t: null, f: [], erro: "não achei o cabeçalho (linha com 'Filial' e 'Produto')"};
  var cols = (linhas[cab] || []).map(function(x){ return x === null || x === undefined ? '' : String(x).trim(); });
  var t = attTipoPorColunas(cols);
  if(!t) return {n: nome, t: null, f: [], erro: 'colunas não reconhecidas'};
  var k = cols.indexOf('Filial'), fs = {};
  for(var j = cab + 1; j < linhas.length; j++){
    var x = (linhas[j] || [])[k];
    if(x === null || x === undefined) continue;
    var s = (typeof x === 'number' && Number.isInteger(x)) ? String(x) : String(x).trim();
    if(!s) continue;
    s = s.padStart(6, '0');
    if(/[^0]/.test(s)) fs[s] = 1;                // célula vazia ou "000000" não é filial
  }
  return {n: nome, t: t, f: Object.keys(fs).sort(), erro: null};
}
function attPlano(novos, atuais){   // a mesma regra do build.py (plano_de_troca)
  var saem = [], avisos = [], vistos = {};
  novos.forEach(function(nv){
    atuais.forEach(function(a){
      if(vistos[a.n]) return;
      var fa = a.f || [], familia = a.t && (nv.t === a.t || (nv.t === 'SD3' && a.t === 'SD3R'));
      var cobre = fa.every(function(x){ return nv.f.indexOf(x) >= 0; });
      var falta = fa.filter(function(x){ return nv.f.indexOf(x) < 0; });
      if(a.n === nv.n){ saem.push({n: a.n, t: a.t, f: fa, por: nv.n, motivo: 'mesmo nome'}); vistos[a.n] = 1; }
      else if(familia && cobre){ saem.push({n: a.n, t: a.t, f: fa, por: nv.n, motivo: 'mesmo tipo e filiais'}); vistos[a.n] = 1; }
      else if(familia && falta.length < fa.length)
        avisos.push(nv.n + ' cobre só parte das filiais de ' + a.n + ' (' + falta.join(', ') + '): a antiga fica. ' +
                    'Para trocar de vez, exporte todas essas filiais juntas.');
    });
  });
  return {entram: novos, saem: saem, avisos: avisos};
}

/* ---------- GitHub ---------- */
async function attGh(metodo, rota, corpo){
  var r = await fetch('https://api.github.com/repos/' + ATT.repo.nome + rota, {
    method: metodo, cache: 'no-store',
    headers: {'Authorization': 'Bearer ' + store('gh_token'), 'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  var j = await r.json().catch(function(){ return {}; });
  if(!r.ok){
    var e = new Error(r.status === 401 ? 'O GitHub recusou o token: ele está errado ou venceu. Esqueça o token e cadastre um novo.'
      : r.status === 403 ? 'O token não tem permissão para gravar. Confira se ele tem Contents: Read and write neste repositório.'
      : r.status === 404 ? 'O GitHub não achou o repositório ' + ATT.repo.nome + ' para este token. Confira se o token dá acesso a ele.'
      : 'O GitHub respondeu com erro ' + r.status + ': ' + (j.message || ''));
    e.status = r.status; throw e;
  }
  return j;
}
function attBase64(buf){
  var b = new Uint8Array(buf), s = '';
  for(var i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
async function attConferirGithub(){
  // primeiro confirma que o token enxerga o repositório: sem isso, "pasta dados vazia" e "sem acesso" parecem iguais
  ATT.msg = 'Conferindo o repositório…'; attRender();
  var info = await attGh('GET', '');
  if(info.permissions && info.permissions.push === false)
    throw new Error('Sua conta só pode ler este repositório, não gravar. Peça acesso de escrita ao dono do repositório.');
  if(!ATT.repo.ramo) ATT.repo.ramo = info.default_branch || 'main';
  ATT.msg = 'Conferindo o que está no GitHub…'; attRender();
  var lista = [];
  try{ lista = await attGh('GET', '/contents/dados?ref=' + encodeURIComponent(ATT.repo.ramo)); }
  catch(e){ if(e.status !== 404) throw e; }
  ATT.listaRepo = {};
  (Array.isArray(lista) ? lista : []).forEach(function(x){ if(x.type === 'file') ATT.listaRepo[x.name] = x.sha; });
  ATT.msg = 'Carregando o leitor de planilhas…'; attRender();
  await attCarregarLeitor();
  var novos = [], recusados = [];
  for(var i = 0; i < ATT.arqs.length; i++){
    var a = ATT.arqs[i];
    ATT.msg = 'Lendo ' + a.name + ' (' + (i + 1) + ' de ' + ATT.arqs.length + ')…'; attRender();
    await new Promise(function(ok){ setTimeout(ok, 30); });     // deixa a tela mostrar o recado antes de ler
    var buf = await a.arrayBuffer();
    var info = attAnalisar(a.name, buf);
    if(info.t){ novos.push(info); ATT.buffers[a.name] = buf; } else recusados.push(info);
  }
  // o que está hoje no GitHub: tipo e filiais vêm do último build; o resto só sai se tiver o mesmo nome
  var conhecidos = {};
  (D.arquivos || []).forEach(function(a){ conhecidos[a.n] = a; });
  var atuais = Object.keys(ATT.listaRepo).filter(function(n){ return /\.xls[xm]?$/i.test(n); })
    .map(function(n){ return conhecidos[n] || {n: n, t: null, f: []}; });
  var p = attPlano(novos, atuais);
  p.recusados = recusados;
  return p;
}
async function attAplicarGithub(tentativa){
  ATT.msg = 'Preparando o envio…'; attRender();
  var ref = await attGh('GET', '/git/ref/heads/' + encodeURIComponent(ATT.repo.ramo));
  if(!ref.object || !ref.object.sha) throw new Error('O GitHub respondeu algo inesperado ao ler o ramo ' + ATT.repo.ramo + '.');
  var commit = await attGh('GET', '/git/commits/' + ref.object.sha);
  if(!commit.tree || !commit.tree.sha) throw new Error('O GitHub respondeu algo inesperado ao ler a última versão.');
  var arvore = [], entram = ATT.plano.entram.map(function(a){ return a.n; });
  for(var i = 0; i < ATT.plano.entram.length; i++){
    var a = ATT.plano.entram[i];
    ATT.msg = 'Enviando ' + a.n + ' (' + (i + 1) + ' de ' + entram.length + ')…'; attRender();
    var blob = await attGh('POST', '/git/blobs', {content: attBase64(ATT.buffers[a.n]), encoding: 'base64'});
    arvore.push({path: 'dados/' + a.n, mode: '100644', type: 'blob', sha: blob.sha});
  }
  ATT.plano.saem.forEach(function(s){
    if(ATT.listaRepo[s.n] && entram.indexOf(s.n) < 0) arvore.push({path: 'dados/' + s.n, mode: '100644', type: 'blob', sha: null});
  });
  ATT.msg = 'Gravando no GitHub…'; attRender();
  var nova = await attGh('POST', '/git/trees', {base_tree: commit.tree.sha, tree: arvore});
  var novo = await attGh('POST', '/git/commits', {message: 'atualiza base pelo app: ' + entram.join(', '),
                                                  tree: nova.sha, parents: [ref.object.sha]});
  try{
    await attGh('PATCH', '/git/refs/heads/' + encodeURIComponent(ATT.repo.ramo), {sha: novo.sha});
  }catch(e){
    if(e.status === 422 && !tentativa) return attAplicarGithub(true);   // alguém publicou no meio: refaz uma vez
    throw e;
  }
  return {ok: true, sairam: ATT.plano.saem.map(function(s){ return s.n; })};
}

/* ---------- computador do servidor ---------- */
async function attPost(rota, corpo){
  var r = await fetch(rota, {method: 'POST', body: corpo || null, cache: 'no-store'});
  var j = await r.json().catch(function(){ return {}; });
  if(!r.ok || j.ok === false) throw new Error(attAcentos(j.erro) || ('O servidor respondeu com erro ' + r.status + '.'));
  return j;
}
async function attConferirServidor(){
  ATT.lote = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  for(var i = 0; i < ATT.arqs.length; i++){
    var a = ATT.arqs[i];
    ATT.msg = 'Mandando ' + a.name + ' para o computador do servidor (' + (i + 1) + ' de ' + ATT.arqs.length + ')…'; attRender();
    await attPost('base/receber?lote=' + ATT.lote + '&nome=' + encodeURIComponent(a.name), a);
  }
  ATT.msg = 'O servidor está lendo as planilhas…'; attRender();
  return attPost('base/conferir?lote=' + ATT.lote);
}

async function attConferir(){
  if(!navigator.onLine && ATT.destino === 'github'){ ATT.msg = 'Sem internet: o envio pelo GitHub precisa de conexão.'; attRender(); return; }
  ATT.etapa = 'conferindo'; ATT.msg = 'Começando…'; attRender();
  try{
    ATT.plano = ATT.destino === 'servidor' ? await attConferirServidor() : await attConferirGithub();
    ATT.etapa = 'plano';
  }catch(e){ ATT.etapa = 'erro'; ATT.msg = attMensagem(e); }
  attRender();
}
function attMensagem(e){
  var m = (e && e.message) || String(e);
  if(e && e.status) return m;                                   // mensagens do GitHub já vêm explicadas
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Sem conexão com ' + (ATT.destino === 'servidor' ? 'o computador do servidor' : 'o GitHub') + '. Confira a rede e tente de novo.';
  if(e instanceof TypeError) return 'Algo deu errado no envio (' + m + '). Nada foi trocado; tente de novo.';
  return m;
}
async function attConfirmar(){
  ATT.etapa = 'enviando'; ATT.msg = 'Atualizando…'; attRender();
  try{
    if(ATT.destino === 'servidor'){
      ATT.msg = 'O servidor está trocando as planilhas…'; attRender();
      ATT.resultado = await attPost('base/aplicar?lote=' + ATT.lote);
    } else {
      ATT.resultado = await attAplicarGithub(false);
    }
    ATT.etapa = 'pronto'; ATT.arqs = []; ATT.buffers = {};
  }catch(e){ ATT.etapa = 'erro'; ATT.msg = attMensagem(e); }
  attRender();
}

/* ---------- cliques ---------- */
function attAcrescentar(lista){
  Array.prototype.forEach.call(lista || [], function(f){
    if(!/\.xls[xm]?$/i.test(f.name) || /^~\$/.test(f.name)) return;
    ATT.arqs = ATT.arqs.filter(function(x){ return x.name !== f.name; });
    ATT.arqs.push(f);
  });
  ATT.msg = ''; attRender();
}
document.getElementById('att-abrir').addEventListener('click', attAbrir);
document.getElementById('att-fechar').addEventListener('click', attFechar);
attJanela.addEventListener('click', function(e){ if(e.target === attJanela) attFechar(); });
attCorpo.addEventListener('change', function(e){
  if(e.target.id === 'att-arq'){ attAcrescentar(e.target.files); e.target.value = ''; }
  if(e.target.name === 'att-dest'){ ATT.destino = e.target.value; ATT.msg = ''; attRender(); }
});
attCorpo.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.dataset.attTirar !== undefined){ ATT.arqs.splice(+t.dataset.attTirar, 1); attRender(); }
  else if(t.id === 'att-conferir') attConferir();
  else if(t.id === 'att-confirmar') attConfirmar();
  else if(t.id === 'att-voltar'){ ATT.etapa = 'escolher'; ATT.msg = ''; attRender(); }
  else if(t.id === 'att-ok') attFechar();
  else if(t.id === 'att-esquecer'){ store('gh_token', null); try{ localStorage.removeItem('estq_gh_token'); }catch(x){} attRender(); }
  else if(t.id === 'att-salvar-token'){
    var v = (document.getElementById('att-token').value || '').trim();
    if(!/^(github_pat_|ghp_)\w{20,}$/.test(v)){ ATT.msg = 'Isso não parece um token do GitHub (começa com github_pat_).'; attRender(); return; }
    store('gh_token', v); ATT.msg = ''; attRender();
  }
});
['dragover', 'dragenter'].forEach(function(ev){
  attCorpo.addEventListener(ev, function(e){ var z = e.target.closest && e.target.closest('#att-solta'); if(z){ e.preventDefault(); z.classList.add('sobre'); } });

attCorpo.addEventListener('dragleave', function(e){ var z = e.target.closest && e.target.closest('#att-solta'); if(z) z.classList.remove('sobre'); });
attCorpo.addEventListener('drop', function(e){

});

<script>
/* Recarrega a página sozinho quando sai uma versão nova da base.
   Funciona no servidor local e no site publicado pelo GitHub Pages.
   Aberto direto do disco (file://), falha na 1ª tentativa e para. */
(function(){
  var atual = null;
  function checar(){
    fetch('versao.txt', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){
        t = t.trim();
        if(!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(t)) return;  // nao e o servidor local
        if(atual === null) atual = t;
        else if(t !== atual){ location.reload(); return; }
        setTimeout(checar, 5000);
      })
      .catch(function(){});
  }
  checar();
})();
</script>
