<style>
:root{
  --bg:#E7ECEE;
  --surface:#FFFFFF;
  --surface-2:#F2F6F7;
  --ink:#121A1F;
  --muted:#5E707B;
  --line:#D3DBDF;
  --line-2:#BCC8CE;
  --steel:#111C24;
  --steel-2:#1B2A34;
  --steel-ink:#EDF3F5;
  --steel-muted:#93A7B2;
  --loc:#F5C518;
  --loc-ink:#241F05;
  --loc-edge:#BE9600;
  --act:#0A5B6A;
  --act-ink:#FFFFFF;
  --act-soft:#DEECEF;
  --alert:#A63E11;
  --alert-soft:#F8E7DE;
  --shadow:0 1px 1px rgba(17,28,36,.04), 0 10px 22px -18px rgba(17,28,36,.5);
  --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1215; --surface:#151E24; --surface-2:#111a1f;
    --ink:#E2EAEE; --muted:#8B9DA8; --line:#26333A; --line-2:#36454D;
    --steel:#080E12; --steel-2:#131F27; --steel-ink:#E8F1F4; --steel-muted:#8CA1AD;
    --loc:#F5C518; --loc-ink:#241F05; --loc-edge:#8F7000;
    --act:#4CA9BA; --act-ink:#05222A; --act-soft:#12303A;
    --alert:#E5885A; --alert-soft:#2C1C15;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 10px 22px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1215; --surface:#151E24; --surface-2:#111a1f;
  --ink:#E2EAEE; --muted:#8B9DA8; --line:#26333A; --line-2:#36454D;
  --steel:#080E12; --steel-2:#131F27; --steel-ink:#E8F1F4; --steel-muted:#8CA1AD;
  --loc:#F5C518; --loc-ink:#241F05; --loc-edge:#8F7000;
  --act:#4CA9BA; --act-ink:#05222A; --act-soft:#12303A;
  --alert:#E5885A; --alert-soft:#2C1C15;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 10px 22px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px;
  line-height:1.45; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--loc); outline-offset:2px; border-radius:4px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ============ barra superior ============ */
.top{
  position:sticky; top:0; z-index:40; background:var(--steel); color:var(--steel-ink);
  border-bottom:3px solid var(--loc);
  padding:10px 14px 11px; padding-top:max(10px, env(safe-area-inset-top));
}
.brandrow{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.brand{
  font-size:15px; font-weight:600; letter-spacing:-.01em; margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand span{color:var(--steel-muted); font-weight:400; font-size:13px}
.iconbtn{
  background:transparent; border:1px solid rgba(255,255,255,.16); border-radius:8px;
  width:34px; height:34px; display:grid; place-items:center; color:var(--steel-muted); flex:none;
  transition:border-color .12s, color .12s;
}
.iconbtn:hover{color:var(--steel-ink); border-color:rgba(255,255,255,.42)}

.searchwrap{position:relative; display:flex; align-items:center}
.searchwrap > svg{position:absolute; left:12px; color:var(--steel-muted); pointer-events:none}
#q{
  width:100%; padding:11px 40px 11px 38px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07); color:var(--steel-ink); border-radius:9px;
  font-size:16px; font-weight:500; transition:border-color .12s, background .12s;
}
#q::placeholder{color:var(--steel-muted)}
#q:focus{border-color:var(--loc); background:rgba(255,255,255,.12); outline:none}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none; appearance:none}
#clearq{
  position:absolute; right:6px; border:none; background:none; color:var(--steel-muted);
  width:30px; height:30px; border-radius:6px; display:none; place-items:center; font-size:15px;
}
#clearq.on{display:grid}
#clearq:hover{color:var(--steel-ink)}

.filters{display:flex; gap:6px; margin-top:9px; overflow-x:auto; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{
  border:1px solid rgba(255,255,255,.18); background:transparent; color:var(--steel-muted);
  padding:5px 11px; border-radius:7px; font-size:12.5px; font-weight:600; white-space:nowrap;
  flex:none; font-family:var(--mono); letter-spacing:.01em; transition:all .12s;
}
.filters .chip:hover{border-color:rgba(255,255,255,.4); color:var(--steel-ink)}
.filters .chip[aria-pressed="true"]{background:var(--steel-ink); border-color:var(--steel-ink); color:var(--steel)}
.filters .chip:first-child,.filters .chip#cs{font-family:var(--sans)}

/* ============ abas ============ */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:45; display:grid;
  grid-template-columns:repeat(5,1fr); background:var(--steel);
  border-top:1px solid rgba(255,255,255,.1); padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  border:none; background:none; color:var(--steel-muted); padding:9px 2px 10px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11px; font-weight:600; position:relative; transition:color .12s;
}
.tab::before{
  content:''; position:absolute; top:0; left:18%; right:18%; height:2px;
  background:var(--loc); opacity:0; transition:opacity .15s;
}
.tab[aria-selected="true"]{color:var(--loc)}
.tab{white-space:nowrap}
@media (max-width:420px){ .tab{font-size:10.5px; padding-left:0; padding-right:0} }
.tab[aria-selected="true"]::before{opacity:1}
.tab .n{
  font-size:10px; font-weight:700; background:var(--loc); color:var(--loc-ink); border-radius:99px;
  padding:0 5px; position:absolute; top:4px; left:calc(50% + 8px); font-family:var(--mono);
}

/* ============ conteudo ============ */
main{padding:14px 14px 92px}
.count{
  color:var(--muted); font-size:12px; font-weight:600; margin:0 2px 10px;
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
}
.count span:last-child{font-family:var(--mono); font-weight:500; color:var(--ink); white-space:nowrap}
.list{display:flex; flex-direction:column; gap:7px}

/* ============ cartao ============ */
.card{
  width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--loc-edge); border-radius:10px; padding:11px 13px; display:block;
  box-shadow:var(--shadow); transition:border-color .12s, transform .08s;
}
.card:hover{border-color:var(--line-2); border-left-color:var(--loc)}
.card:active{transform:scale(.995)}
.card.aviso{border-left-color:var(--alert)}
.card.zero{background:var(--surface-2); border-left-color:var(--line-2); box-shadow:none}
.l1{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.code{
  font-family:var(--mono); font-size:12px; font-weight:500; color:var(--muted);
  letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.fil{
  font-family:var(--mono); font-size:10.5px; font-weight:500; color:var(--muted);
  margin-left:auto; background:var(--surface-2); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px;
}
.desc{
  font-weight:600; font-size:14.5px; line-height:1.3; margin:0 0 9px; letter-spacing:-.005em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.l3{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.loc{
  font-family:var(--mono); font-weight:600; font-size:12.5px; letter-spacing:.05em;
  background:var(--loc); color:var(--loc-ink); border-radius:4px; padding:4px 9px;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
}
.loc.none{
  background:transparent; color:var(--alert); border:1px dashed var(--alert);
  box-shadow:none; font-weight:500; letter-spacing:.01em; font-family:var(--sans); font-size:12px;
}
.qty{margin-left:auto; text-align:right; line-height:1.05; flex:none; padding-left:8px}
.qty b{
  font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.qty small{display:block; font-size:10px; color:var(--muted); font-weight:600; margin-top:3px}
.qty.z b{color:var(--muted); font-weight:400}
.flag{
  font-size:11px; font-weight:600; padding:3px 7px; border-radius:4px;
  background:var(--alert-soft); color:var(--alert);
}
.flag.ok{background:var(--act-soft); color:var(--act)}
.flag.ctrl{background:transparent; color:var(--act); border:1px solid var(--act); padding:2px 6px}
.flag.nctrl{background:var(--surface-2); color:var(--muted); border:1px solid var(--line-2); padding:2px 6px}
.flag.sctrl{background:transparent; color:var(--muted); border:1px dashed var(--line-2); padding:2px 6px; font-weight:500}
.arm{
  font-family:var(--mono); font-size:11px; font-weight:500; color:var(--muted);
  background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:2px 6px;
}

/* ============ painel ============ */
.panel{
  position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .22s cubic-bezier(.32,.72,0,1); visibility:hidden;
}
.panel.open{transform:none; visibility:visible}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.phead{
  background:var(--steel); color:var(--steel-ink); border-bottom:3px solid var(--loc);
  padding:13px 14px; padding-top:max(13px, env(safe-area-inset-top));
  display:flex; gap:11px; align-items:flex-start;
}
.phead h2{margin:0; font-size:16px; font-weight:600; line-height:1.3; flex:1; letter-spacing:-.01em}
.phead .code{color:var(--steel-muted); font-size:11.5px; display:block; margin-top:5px}
.phead .iconbtn{margin-top:1px}
.pbody{flex:1; overflow-y:auto; padding:13px 14px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch}

.numeros{
  display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface);
  border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:10px;
  box-shadow:var(--shadow);
}
.numeros div{padding:12px 8px; text-align:center; border-right:1px solid var(--line)}
.numeros div:last-child{border-right:none}
.numeros b{
  display:block; font-family:var(--mono); font-size:22px; font-weight:600;
  letter-spacing:-.03em; line-height:1.15; font-variant-numeric:tabular-nums;
}
.numeros small{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:3px; display:block}
.numeros .hi{background:var(--act-soft)}
.numeros .hi b{color:var(--act)}
.numeros .hi small{color:var(--act)}

.block{
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:13px; margin-bottom:10px; box-shadow:var(--shadow);
}
.block h3{
  margin:0 0 10px; font-size:11.5px; font-weight:700; color:var(--muted);
  letter-spacing:.02em; display:flex; align-items:center; gap:7px;
}
.block h3::after{content:''; flex:1; height:1px; background:var(--line)}
.locrow{display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line)}
.locrow:first-of-type{padding-top:0}
.locrow:last-child{border-bottom:none; padding-bottom:0}
.locrow .qn{
  margin-left:auto; font-family:var(--mono); font-weight:600; font-size:17px;
  font-variant-numeric:tabular-nums;
}
.locrow em{font-style:normal; font-size:12px; color:var(--alert); font-weight:500; line-height:1.4}
.kv{display:grid; grid-template-columns:1fr auto; gap:7px 14px; font-size:13.5px; margin:0}
.kv dt{color:var(--muted)}
.kv dd{
  margin:0; font-family:var(--mono); font-weight:500; text-align:right;
  font-variant-numeric:tabular-nums;
}
.kv dd.warn{color:var(--alert)}
.btnrow{display:flex; gap:8px; margin-bottom:10px}
.btn{
  flex:1; border:1px solid var(--act); background:var(--act); color:var(--act-ink);
  border-radius:9px; padding:12px; font-weight:600; font-size:14px; transition:filter .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--surface); color:var(--act)}
.btn:disabled{opacity:.5; cursor:default}

/* ============ enderecos ============ */
.ruas{
  display:flex; flex-wrap:nowrap; gap:6px; margin-bottom:14px; overflow-x:auto;
  scrollbar-width:none; padding-bottom:2px;
}
.ruas::-webkit-scrollbar{display:none}
.rua{
  flex:none; border:1px solid var(--line); background:var(--surface); border-radius:7px;
  padding:7px 10px; font-family:var(--mono); font-weight:600; font-size:12.5px;
  letter-spacing:.03em; transition:all .12s;
}
.rua:hover{border-color:var(--line-2)}
.rua[aria-pressed="true"]{background:var(--steel); border-color:var(--steel); color:var(--loc)}
.rua i{font-style:normal; font-weight:400; color:var(--muted); font-size:11px; margin-left:5px}
.rua.txt{font-family:var(--sans); letter-spacing:0}
/* selecao de produtos para separar */
.barra-sel{
  position:sticky; top:var(--top-h,0px); z-index:20; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--bg); padding:8px 2px 10px; border-bottom:1px solid var(--line);
}
.selall{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; color:var(--ink);
  cursor:pointer; user-select:none}
.selall i{font-style:normal; color:var(--muted); font-weight:500; font-family:var(--mono); font-size:12px}
.selall input,.marca input{width:21px; height:21px; accent-color:var(--act); cursor:pointer; margin:0}
.barra-sel .acoes{margin-left:auto; display:flex; align-items:center; gap:8px}
.barra-sel .nsel{font-size:12.5px; font-weight:700; color:var(--act)}
.btn.mini{flex:none; padding:8px 14px; font-size:13px}
.dica-sel{margin-left:auto; font-size:12px; color:var(--muted)}
.linha-sel{display:flex; gap:7px; align-items:stretch}
.linha-sel .card{flex:1; min-width:0}
.marca{flex:none; width:42px; display:grid; place-items:center; border-radius:10px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); transition:background .12s, border-color .12s}
.marca:hover{border-color:var(--act)}
.marca.vazia{background:transparent; border-color:transparent; cursor:default}
.linha-sel.on .marca{background:var(--act-soft); border-color:var(--act)}
.linha-sel.on .card{border-color:var(--act); box-shadow:0 0 0 1px var(--act)}
.toast{
  position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--steel); color:var(--steel-ink); padding:11px 16px; border-radius:10px; font-size:13.5px;
  font-weight:600; box-shadow:0 10px 30px -10px rgba(0,0,0,.6); z-index:70; opacity:0; transition:opacity .2s;
  pointer-events:none; max-width:92vw; text-align:center; border-left:3px solid var(--loc);
}
.toast.on{opacity:1}
/* Jarvis */
.jv-abrir{flex:none; display:flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:8px;
  border:1px solid rgba(245,197,24,.55); background:transparent; color:var(--loc); font-weight:700;
  font-size:13px; letter-spacing:.04em}
.jv-abrir:hover{background:rgba(245,197,24,.1); border-color:var(--loc)}
.jv{position:fixed; inset:0; z-index:65; display:flex; flex-direction:column; background:var(--bg);
  transform:translateY(100%); visibility:hidden; transition:transform .22s cubic-bezier(.32,.72,0,1)}
.jv.open{transform:none; visibility:visible}
@media (prefers-reduced-motion:reduce){.jv{transition:none}}
@media (min-width:860px){

    border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,.55); overflow:hidden}
}
.jv-head{background:var(--steel); color:var(--steel-ink); border-bottom:3px solid var(--loc); padding:12px 14px;
  padding-top:max(12px, env(safe-area-inset-top)); display:flex; align-items:center; gap:10px}
.jv-head h2{margin:0; font-size:16px; font-weight:700; flex:1; letter-spacing:.08em; color:var(--loc)}
.jv-head h2 small{display:block; font-size:11px; font-weight:500; color:var(--steel-muted); letter-spacing:0; margin-top:2px}

  overflow-wrap:anywhere}
.jv-m.eu{align-self:flex-end; background:var(--act); color:var(--act-ink); border-bottom-right-radius:4px}
.jv-m.ele{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--loc);
  border-bottom-left-radius:4px}
.jv-m.pensando{align-self:flex-start; color:var(--muted); font-size:13px; font-style:italic; padding:4px 2px}
.jv-m.sis{align-self:stretch; max-width:100%; background:var(--surface); border:1px dashed var(--line-2);
  color:var(--muted); font-size:13.5px}
.jv-m.erro{align-self:stretch; max-width:100%; background:var(--alert-soft); color:var(--alert); font-size:13.5px}
.jv-m a.cod{font-family:var(--mono); color:var(--act); font-weight:600; text-decoration:underline; cursor:pointer}
.jv-sug{display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-top:10px; white-space:normal}
.jv-sug button{border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); border-radius:99px;
  padding:7px 12px; font-size:13px; font-weight:600; text-align:left}
.jv-sug button:hover{border-color:var(--act); color:var(--act)}
.jv-form{display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:var(--surface)}
.jv-form textarea{flex:1; resize:none; border:1px solid var(--line-2); border-radius:10px; padding:11px 12px;
  font-family:var(--sans); font-size:16px; line-height:1.35; background:var(--surface-2); color:var(--ink);
  max-height:120px; min-height:46px}
@media (min-width:860px){ .jv-form textarea{font-size:14px} }
.jv-form textarea:focus{outline:none; border-color:var(--act)}

.jv-form button{flex:none; width:48px; border-radius:10px; border:none; background:var(--act); color:var(--act-ink);

.jv-m .gmf a{color:var(--act); font-weight:600}
.jv-m .gms{margin-top:8px; overflow-x:auto}
.btn.jv-perg{width:100%; margin-bottom:10px; color:var(--steel); border-color:var(--loc-edge);
  background:rgba(245,197,24,.12)}
.btn.jv-perg svg{vertical-align:-2px; margin-right:6px}
@media (min-width:860px){ .toast{bottom:28px} }
.ctrlrow{margin-top:-4px; align-items:center}
.ctrlrot{flex:none; font-size:12px; font-weight:700; color:var(--muted); margin-right:2px; white-space:nowrap}
.rua[aria-pressed="true"] i{color:var(--steel-muted)}
.locgroup{margin-bottom:14px}
.locgroup > h3{
  margin:0 0 7px; font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.06em;
  background:var(--steel); color:var(--loc); border-left:3px solid var(--loc);

  align-items:center;
}
.locgroup > h3 span{font-family:var(--sans); font-size:11px; font-weight:500; color:var(--steel-muted); letter-spacing:0}
.locgroup > h3 .dir{display:flex; align-items:center; gap:9px}
.imp1{
  border:1px solid rgba(255,255,255,.2); background:transparent; color:var(--steel-muted);
  border-radius:6px; width:30px; height:27px; display:grid; place-items:center; padding:0;

}

.btn svg{vertical-align:-2px; margin-right:7px}

  .tab .n{position:static; padding:1px 6px}
  main{
    padding:18px 22px 40px; display:grid; gap:20px; align-items:start;
    grid-template-columns:minmax(340px,1.05fr) minmax(360px,.95fr); max-width:1340px; margin:0 auto;
  }
  main.single{grid-template-columns:1fr; max-width:920px}
  .panel{
    position:sticky; top:calc(var(--top-h,116px) + 18px); inset:auto; transform:none;
    visibility:visible; background:none; max-height:calc(100vh - var(--top-h,116px) - 36px);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .panel .phead{padding-top:13px; border-radius:11px 11px 0 0}
  .panel .phead .iconbtn{display:none}
  .pbody{padding:13px}
  main.single .col2{
    position:fixed; inset:0; z-index:60; display:grid; place-items:center;
    background:rgba(7,13,17,.55); visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .15s;
  }
  main.single .col2:not(.on) .panel{visibility:hidden}
  main.single .col2.on{visibility:visible; opacity:1; pointer-events:auto}
  main.single .panel{position:relative; top:auto; width:min(580px,92vw); max-height:86vh}
  main.single .panel .phead .iconbtn{display:grid}
  .ruas{flex-wrap:wrap; overflow:visible}
  .card{padding:12px 14px}
}
@media (max-width:859px){
  main{display:block}
  body.locked{overflow:hidden}
  .brand span{display:none}
}

/* ============ impressao ============ */
@media print{
  .top,.tabs,.btnrow,.sep .x,.sep .chk,.count,.rodape,.jv,.jv-abrir,.toast{display:none !important}

  #area-impressao .t-pend th:nth-child(4){width:13%}

  #area-impressao .assina{margin-top:28px; display:flex; gap:40px; font-size:10pt; break-inside:avoid}
  #area-impressao .assina span{flex:1; border-top:1px solid #000; padding-top:4px}

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('dados').textContent);
var FIL = D.filiais, DESCS = D.descs;
var EPOCH = Date.UTC(2000,0,1), HOJE = Math.floor((Date.now()-EPOCH)/864e5);
var SEMSB2 = D.semSB2 || [];
var SEM_CUSTOS = D.semCustos === true;
function semSaldoFisico(f){ return SEMSB2.indexOf(FIL[f])>=0; }

/* ---------- utilidades ---------- */
function norm(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
function nq(n){ if(!n) return '0'; return n.toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function nm(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2}); }
function data(n){ if(!n) return '—'; var d=new Date(EPOCH+n*864e5);
  return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
function plural(n,s,p){ return n===1 ? s : p; }
function copiarTexto(texto){
  /* A área de transferência moderna só funciona em https ou localhost.
     Pelo IP da rede o navegador bloqueia, então cai no plano B. */
  if(navigator.clipboard && window.isSecureContext){
    try{ return navigator.clipboard.writeText(texto); }catch(e){}
  }
  return new Promise(function(deuCerto, falhou){
    try{
      var area = document.createElement('textarea');
      area.value = texto;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '0';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, texto.length);
      var foi = document.execCommand('copy');
      document.body.removeChild(area);
      foi ? deuCerto() : falhou();
    }catch(erro){ falhou(erro); }
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function el(h){ var t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem('estq_'+k)); localStorage.setItem('estq_'+k, JSON.stringify(v)); }catch(e){ return null; } }

/* ---------- montagem dos itens ---------- */
var ITENS = [], PORLOC = {}, ID = 0;
function addItem(f, c, d, rows){
  var saldo=0, emp=0, valor=0, prev=0, aend=0, ultS=0, ultM=0, ends=[], somaEnd=0, arms=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    saldo+=r[1]; emp+=r[2]; valor+=r[1]*r[3]; prev+=r[4]; aend+=r[5];
    if(r[6]>ultS) ultS=r[6]; if(r[7]>ultM) ultM=r[7];
    arms.push(r[0]);
    for(var j=0;j<r[9].length;j++){
      var e=r[9][j]; ends.push({e:e[0], q:e[1], emp:e[2], arm:r[0]}); somaEnd+=e[1];
    }
  }
  ends.sort(function(a,b){ return b.q-a.q; });
  var it={ id:ID++, f:f, c:c, d:d, rows:rows, saldo:saldo, emp:emp, disp:saldo-emp, valor:valor,
    prev:prev, aend:aend, ultS:ultS, ultM:ultM, ends:ends, somaEnd:somaEnd, arms:arms,
    div: ends.length>0 && Math.abs(somaEnd-saldo)>0.001 && SEMSB2.indexOf(FIL[f])<0,
    semEnd: saldo>0 && ends.length===0,
    idx: c+' '+norm(d) };
  ITENS.push(it);
  for(var k=0;k<ends.length;k++){
    (PORLOC[ends[k].e] = PORLOC[ends[k].e] || []).push({it:it, q:ends[k].q, arm:ends[k].arm});
  }
  return it;
}
function lerControle(v){ return v === 1 ? true : v === 0 ? false : null; }
D.ativos.forEach(function(a){
  var it = addItem(a.f, a.c, DESCS[a.d]||'(sem descrição)', a.r);
  it.ctrl = lerControle(a.e);
});
D.zerados.forEach(function(z){
  var it = addItem(z[0], z[1], DESCS[z[2]]||'(sem descrição)', []);
  it.ultS = z[3]; it.zero = true; it.ctrl = lerControle(z[4]);
});
ITENS.forEach(function(it){
  if(it.ctrl === false && it.semEnd){ it.semEnd = false; it.naoCtrl = true; }
});
var MAPA = {};
ITENS.forEach(function(it){ MAPA[it.f + '|' + it.c] = it; });
var LOCS = Object.keys(PORLOC).sort();
LOCS.forEach(function(L){ PORLOC[L].sort(function(a,b){ return b.q-a.q; }); });
var RUAS = {};
LOCS.forEach(function(L){ var r=L.split('-')[0]; (RUAS[r]=RUAS[r]||[]).push(L); });
var RUAKEYS = Object.keys(RUAS).sort(function(a,b){
  var ca = /^[A-Z]\d{2}$/.test(a) ? 0 : 1, cb = /^[A-Z]\d{2}$/.test(b) ? 0 : 1;
  return ca!==cb ? ca-cb : (a<b?-1:a>b?1:0);
});

/* ---------- estado ---------- */
var S = {
  tab:'prod', q:'', fil: store('fil') || '', comSaldo: store('comSaldo')!==false,
  sel:null, rua:null, ctrl:null, selec:{}, invDia:null, invTipo:null, cega:false, sep: store('sep') || []
};

/* ---------- filtros ---------- */
var elFiltros = document.getElementById('filtros');
function renderFiltros(){
  var h = '<button class="chip" data-f="" aria-pressed="'+(S.fil===''?'true':'false')+'">Todas as filiais</button>';
  FIL.forEach(function(f){
    h += '<button class="chip" data-f="'+f+'" aria-pressed="'+(S.fil===f?'true':'false')+'">'+f+'</button>';
  });
  if(S.tab==='prod') h += '<button class="chip" id="cs" aria-pressed="'+(S.comSaldo?'true':'false')+'">Só com saldo</button>';
  elFiltros.innerHTML = h;
}
elFiltros.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id==='cs'){ S.comSaldo=!S.comSaldo; store('comSaldo',S.comSaldo); }
  else { S.fil = b.dataset.f; store('fil', S.fil); }
  renderFiltros(); render();
});

/* ---------- busca ---------- */
var elQ = document.getElementById('q'), elClear = document.getElementById('clearq'), tmr;
elQ.addEventListener('input', function(){
  elClear.classList.toggle('on', elQ.value.length>0);
  clearTimeout(tmr); tmr = setTimeout(function(){ S.q = norm(elQ.value.trim()); render(); }, 130);
});
elClear.addEventListener('click', function(){ elQ.value=''; S.q=''; elClear.classList.remove('on'); elQ.focus(); render(); });

function buscar(){
  var q = S.q, fil = S.fil, cs = S.comSaldo, out = [], termos = q ? q.split(/\s+/) : [];
  for(var i=0;i<ITENS.length;i++){
    var it = ITENS[i];
    if(fil && FIL[it.f]!==fil) continue;
    if(cs && it.saldo<=0) continue;
    if(termos.length){
      var ok=true;
      for(var t=0;t<termos.length;t++){ if(it.idx.indexOf(termos[t])<0){ ok=false; break; } }
      if(!ok){
        var achouLoc=false;
        for(var e=0;e<it.ends.length && !achouLoc;e++){ if(it.ends[e].e.indexOf(q)===0) achouLoc=true; }
        if(!achouLoc) continue;
      }
    }
    out.push(it);
  }
  out.sort(function(a,b){
    if((b.saldo>0)-(a.saldo>0)) return (b.saldo>0)-(a.saldo>0);
    if(q){
      var ax = a.c.indexOf(q)===0?0:1, bx = b.c.indexOf(q)===0?0:1;
      if(ax!==bx) return ax-bx;
    }
    return a.c < b.c ? -1 : a.c > b.c ? 1 : a.f-b.f;
  });
  return out;
}

/* ---------- cartões ---------- */
function catControle(it){ return it.ctrl === true ? 'sim' : it.ctrl === false ? 'nao' : 'sem'; }

function chipsControle(cont){
  var ops = [['', 'Todos', cont.sim + cont.nao + cont.sem],
             ['sim', 'Sim', cont.sim],
             ['nao', 'Nao', cont.nao],
             ['sem', 'Fora da SBZ', cont.sem]];
  var h = '<div class="ruas ctrlrow"><span class="ctrlrot">Contr. Endereço</span>';
  ops.forEach(function(o){
    if(o[0] === 'sem' && !o[2] && S.ctrl !== 'sem') return;   // so aparece se existir
    h += '<button class="rua txt" data-ctrl="' + o[0] + '" aria-pressed="' +
         ((S.ctrl || '') === o[0] ? 'true' : 'false') + '">' + o[1] +
         '<i>' + o[2].toLocaleString('pt-BR') + '</i></button>';
  });
  return h + '</div>';
}

function mostrarEscolhido(){
  var linha = lista.querySelector('.ctrlrow'), ativo = linha && linha.querySelector('[aria-pressed="true"]');
  if(ativo && ativo.offsetLeft + ativo.offsetWidth > linha.clientWidth) linha.scrollLeft = ativo.offsetLeft - 14;
}

function etiquetaControle(it){
  if(it.ctrl === true)  return '<span class="flag ctrl" title="Campo Contr.Endere da SBZ">Contr. Endereço: Sim</span>';
  if(it.ctrl === false) return '<span class="flag nctrl" title="Campo Contr.Endere da SBZ">Contr. Endereço: Nao</span>';
  return '<span class="flag sctrl" title="Produto sem registro na SBZ">Contr. Endereço: fora da SBZ</span>';
}

function cardHTML(it){
  var loc;
  if(it.ends.length===0) loc = it.saldo<=0 ? ''
    : it.naoCtrl ? '<span class="flag nctrl">Contr. Endereço: Nao</span>'
    : '<span class="loc none">sem endereço</span>';
  else{
    loc = '<span class="loc">'+esc(it.ends[0].e)+'</span>';
    if(it.ends.length>1) loc += '<span class="flag ok">+'+(it.ends.length-1)+' '+plural(it.ends.length-1,'local','locais')+'</span>';
  }
  var flags = '';
  if(it.div) flags += '<span class="flag">divergência</span>';
  if(it.emp>0) flags += '<span class="flag">'+nq(it.emp)+' empenhado</span>';
  var estado = it.saldo<=0 ? ' zero' : (it.semEnd || it.div ? ' aviso' : '');
  return '<button class="card'+estado+'" data-id="'+it.id+'">'+
    '<div class="l1"><span class="code">'+it.c+'</span><span class="fil">'+FIL[it.f]+'</span></div>'+
    '<p class="desc">'+esc(it.d)+'</p>'+
    '<div class="l3">'+loc+flags+
      '<span class="qty'+(it.saldo>0?'':' z')+'"><b>'+(it.saldo>0?nq(it.saldo):'0')+'</b><small>'+
      (it.saldo>0 ? (it.emp>0 ? nq(it.disp)+' disponível' : 'em estoque') : 'sem saldo')+'</small></span>'+
    '</div></button>';
}

/* ---------- detalhe ---------- */
var panel = document.getElementById('panel'), pbody = document.getElementById('pbody'), ptitle = document.getElementById('ptitle');
function abrir(id){
  var it = ITENS[id]; S.sel = it;
  ptitle.innerHTML = esc(it.d) + '<span class="code">'+it.c+' · filial '+FIL[it.f]+'</span>';
  var h = '';
  if(semSaldoFisico(it.f)){
    h += '<div class="block"><h3>Atenção</h3><p style="margin:0;font-size:13.5px;color:var(--alert)">'+
      'A filial '+FIL[it.f]+' só tem o saldo por endereço importado. O saldo físico desta filial não está nesta base, '+
      'então os números abaixo vêm apenas do endereçamento.</p></div>';
  }
  h += '<div class="numeros">'+
    '<div><b>'+nq(it.saldo)+'</b><small>saldo</small></div>'+
    '<div><b>'+nq(it.emp)+'</b><small>empenhado</small></div>'+
    '<div class="hi"><b>'+nq(it.disp)+'</b><small>disponível</small></div></div>';

  h += '<div class="btnrow">'+
    '<button class="btn" id="addsep">Separar</button>'+
    '<button class="btn ghost" id="copiar">Copiar código</button></div>' +
    '<button class="btn ghost jv-perg" id="jv-perg"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>Perguntar ao Jarvis sobre este produto</button>';

  var linhaCtrl = '<div class="locrow"><span style="color:var(--muted);font-size:13px">Indicador da SBZ</span>' +
    '<span style="margin-left:auto">' + etiquetaControle(it) + '</span></div>';
  if(it.ends.length){
    h += '<div class="block"><h3>Onde está</h3>' + linhaCtrl;
    it.ends.forEach(function(e){
      h += '<div class="locrow"><span class="loc">'+esc(e.e)+'</span>'+
           '<span class="arm">arm '+e.arm+'</span>'+
           (e.emp>0?'<em>'+nq(e.emp)+' emp.</em>':'')+
           '<span class="qn">'+nq(e.q)+'</span></div>';
    });
    if(it.div){
      var dif = it.somaEnd - it.saldo;
      h += '<div class="locrow"><em>Endereços somam '+nq(it.somaEnd)+' e o saldo físico é '+nq(it.saldo)+
           ' ('+(dif>0?'+':'')+nq(dif)+'). Confira antes de separar.</em></div>';
    }
    h += '</div>';
  } else if(it.saldo>0 && it.naoCtrl){
    h += '<div class="block"><h3>Onde está</h3>' + linhaCtrl +
         '<div class="locrow"><span class="arm">armazém</span><span class="qn">'+nq(it.saldo)+'</span></div>'+
         '<div class="locrow"><span style="font-size:12.5px;color:var(--muted)">Contr. Endereço = Nao: o produto '+
         'fica no armazém sem posição definida. Não é pendência.</span></div></div>';
  } else if(it.saldo>0){
    h += '<div class="block"><h3>Onde está</h3>' + linhaCtrl + '<div class="locrow">'+
         '<span class="loc none">sem endereço cadastrado</span>'+
         '<span class="qn">'+nq(it.saldo)+'</span></div>'+
         '<div class="locrow"><em>Tem saldo físico, mas nenhum endereço. Localize e enderece no sistema.</em></div></div>';
  } else {
    h += '<div class="block"><h3>Onde está</h3>' + linhaCtrl + '</div>';
  }

  h += '<div class="block"><h3>Por armazém</h3><dl class="kv">';
  if(it.rows.length){
    it.rows.forEach(function(r){
      h += '<dt>Armazém '+r[0]+'</dt><dd>'+nq(r[1])+(r[2]>0?' <span style="color:var(--muted)">('+nq(r[2])+' emp.)</span>':'')+'</dd>';
    });
  } else { h += '<dt>Sem movimento de saldo</dt><dd>0</dd>'; }
  h += '</dl></div>';

  h += '<div class="block"><h3>Movimentação e custo</h3><dl class="kv">'+
    '<dt>Última saída</dt><dd'+(it.ultS && HOJE-it.ultS>365 ? ' class="warn"':'')+'>'+data(it.ultS)+
      (it.ultS?' <span style="color:var(--muted)">('+(HOJE-it.ultS)+'d)</span>':'')+'</dd>'+
    '<dt>Último movimento</dt><dd>'+data(it.ultM)+'</dd>'+
    (it.prev>0?'<dt>Previsto a receber</dt><dd>'+nq(it.prev)+'</dd>':'')+
    (it.aend>0?'<dt>A endereçar</dt><dd class="warn">'+nq(it.aend)+'</dd>':'')+
    (it.rows.length && it.rows[0][8] ? '<dt>Último inventário</dt><dd>'+data(it.rows[0][8])+'</dd>':'')+
    (it.saldo>0 && !SEM_CUSTOS ?'<dt>Custo unitário</dt><dd>'+nm(it.valor/it.saldo)+'</dd>'+
                '<dt>Valor em estoque</dt><dd>'+nm(it.valor)+'</dd>':'')+
    '</dl></div>';

  pbody.innerHTML = h;
  pbody.scrollTop = 0;
  panel.classList.add('open');
  document.querySelector('.col2').classList.add('on');
  if(window.innerWidth < 860) document.body.classList.add('locked');
  document.getElementById('addsep').addEventListener('click', function(){ addSep(it); });
  document.getElementById('jv-perg').addEventListener('click', function(){
    abrirJarvis(null, it);
  });
  document.getElementById('copiar').addEventListener('click', function(e){
    var botao = e.currentTarget;
    copiarTexto(it.c).then(function(){
      botao.textContent = 'Copiado';
      setTimeout(function(){ botao.textContent = 'Copiar código'; }, 1400);
    }, function(){
      botao.textContent = 'Não consegui copiar';
      setTimeout(function(){ botao.textContent = 'Copiar código'; }, 2200);
    });
  });
}
function fechar(){ panel.classList.remove('open'); document.body.classList.remove('locked');
  document.querySelector('.col2').classList.remove('on'); }
document.getElementById('closep').addEventListener('click', fechar);
document.querySelector('.col2').addEventListener('click', function(e){
  if(e.target===this && document.getElementById('main').classList.contains('single')) fechar();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && jvPainel.classList.contains('open')){ fecharJarvis(); return; }
  if(e.key==='Escape' && panel.classList.contains('open')) fechar();
  var foco = (document.activeElement || {}).tagName;
  if(e.key==='/' && foco!=='INPUT' && foco!=='TEXTAREA'){ e.preventDefault(); elQ.focus(); elQ.select(); }
});

/* ---------- separação ---------- */
function addSep(it){
  var ex = S.sep.filter(function(s){ return s.f===it.f && s.c===it.c; })[0];
  if(ex){ ex.qtd = (+ex.qtd||0)+1; }
  else S.sep.push({f:it.f, c:it.c, qtd:1, ok:false});
  store('sep', S.sep); badge();
  var b = document.getElementById('addsep');
  if(b){ b.textContent='Na lista ✓'; setTimeout(function(){ b.textContent='Separar'; }, 1400); }
}
function badge(){
  var n = document.getElementById('sepn');
  n.textContent = S.sep.length; n.hidden = S.sep.length===0;
}
function itemDe(f,c){ return MAPA[f + '|' + c] || null; }

/* ---------- abas ---------- */
var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(t){
  t.addEventListener('click', function(){
    tabs.forEach(function(x){ x.setAttribute('aria-selected', x===t?'true':'false'); });
    S.tab = t.dataset.tab; S.rua = null; fechar();
    document.body.classList.remove('imprimindo');
    elQ.value=''; S.q=''; elClear.classList.remove('on');
    elQ.placeholder = S.tab==='end' ? 'Endereço ou produto (ex.: A03 ou filtro)'
      : S.tab==='pend' ? 'Código, descrição ou número da nota'
      : S.tab==='inv' ? 'Código, descrição, endereço ou equipamento'
      : 'Código, descrição ou endereço';
    renderFiltros(); render();
  });
});

/* ---------- render ---------- */
var lista = document.getElementById('lista'), cont = document.getElementById('count'), main = document.getElementById('main');
function render(){
  main.classList.toggle('single', S.tab!=='prod');
  document.getElementById('sw').style.display = S.tab==='sep' ? 'none' : '';
  if(S.tab==='prod') renderProd();
  else if(S.tab==='end') renderEnd();
  else if(S.tab==='pend') renderPend();
  else if(S.tab==='inv') renderInv();
  else renderSep();
}

var ULTIMOS_PROD = [];

function selecionavel(it){ return it.saldo > 0; }

function barraSelecao(){
  var total = ULTIMOS_PROD.length;
  var noRes = ULTIMOS_PROD.filter(function(id){ return S.selec[id]; }).length;
  var qtd = Object.keys(S.selec).length;
  return '<div class="barra-sel" id="barra-sel">' +
    '<label class="selall"><input type="checkbox" id="selall"' +
      (total && noRes === total ? ' checked' : '') + (total ? '' : ' disabled') +
      ' data-parcial="' + (noRes > 0 && noRes < total ? 1 : 0) + '"> Selecionar todos <i>' +
      total.toLocaleString('pt-BR') + '</i></label>' +
    (qtd
      ? '<span class="acoes"><span class="nsel">' + qtd + ' ' + plural(qtd,'selecionado','selecionados') + '</span>' +
        '<button class="btn ghost mini" id="sel-limpar">Limpar</button>' +
        '<button class="btn mini" id="sel-separar">Separar</button></span>'
      : '<span class="dica-sel">marque os produtos para separar</span>') +
    '</div>';
}

function ajustarParcial(){
  var c = document.getElementById('selall');
  if(c) c.indeterminate = c.dataset.parcial === '1';
}

function atualizarBarra(){
  var b = document.getElementById('barra-sel');
  if(!b) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = barraSelecao();
  b.parentNode.replaceChild(tmp.firstChild, b);
  ajustarParcial();
}

function linhaProduto(it){
  var pode = selecionavel(it), on = pode && S.selec[it.id];
  return '<div class="linha-sel' + (on ? ' on' : '') + '">' +
    (pode
      ? '<label class="marca" title="Selecionar para separar"><input type="checkbox" data-sel="' + it.id + '"' +
        (on ? ' checked' : '') + ' aria-label="Selecionar ' + esc(it.c) + ' para separar"></label>'
      : '<span class="marca vazia" title="Sem saldo para separar"></span>') +
    cardHTML(it) + '</div>';
}

function avisar(txt){
  var t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = txt;
  t.classList.add('on');
  clearTimeout(avisar.tempo);
  avisar.tempo = setTimeout(function(){ t.classList.remove('on'); }, 2800);
}

function separarSelecionados(){
  var ids = Object.keys(S.selec);
  if(!ids.length) return;
  if(ids.length > 50 && !confirm('Adicionar ' + ids.length + ' itens à separação de uma vez?')) return;
  var novos = 0, ja = 0;
  ids.forEach(function(id){
    var it = ITENS[+id];
    if(!it) return;
    var existe = S.sep.some(function(s){ return s.f === it.f && s.c === it.c; });
    if(existe){ ja++; return; }
    S.sep.push({f:it.f, c:it.c, qtd:1, ok:false});
    novos++;
  });
  store('sep', S.sep); badge();
  S.selec = {};
  render();
  avisar(novos + ' ' + plural(novos,'item enviado','itens enviados') + ' para a separação' +
         (ja ? ' · ' + ja + ' já ' + plural(ja,'estava','estavam') + ' na lista' : ''));
}

function renderProd(){
  var todos = buscar(), cc = {sim:0, nao:0, sem:0};
  todos.forEach(function(it){ cc[catControle(it)]++; });
  var r = S.ctrl ? todos.filter(function(it){ return catControle(it) === S.ctrl; }) : todos;
  var n = r.length, lim = r.slice(0,150);
  var comSaldo = 0, valor = 0;
  for(var i=0;i<n;i++){ if(r[i].saldo>0){ comSaldo++; valor+=r[i].valor; } }
  cont.innerHTML = '<span>'+n.toLocaleString('pt-BR')+' '+plural(n,'item','itens')+
    (n>150?' · mostrando 150':'')+'</span>'+(SEM_CUSTOS?'':'<span>'+nm(valor)+'</span>');
  ULTIMOS_PROD = r.filter(selecionavel).map(function(it){ return it.id; });
  lista.innerHTML = chipsControle(cc) + barraSelecao() + (n===0
    ? '<p class="empty"><b>Nada encontrado</b>' +
      (S.ctrl && todos.length
        ? 'Nenhum destes produtos está em “' + {sim:'Contr. Endereço: Sim', nao:'Contr. Endereço: Nao', sem:'fora da SBZ'}[S.ctrl] + '”.'
        : 'Tente o código do produto, parte da descrição ou o endereço (ex.: A01-B03).') +
      (S.comSaldo?'<br>O filtro “Só com saldo” está ligado.':'')+'</p>'
    : lim.map(linhaProduto).join(''));
  ajustarParcial();
  mostrarEscolhido();
}

function renderEnd(){
  var tira = lista.querySelector('.ruas');
  var rolagem = tira ? tira.scrollLeft : 0;
  var q = S.q, termos = q ? q.split(/\s+/) : [];
  function casaItem(it){
    if(!termos.length) return true;
    for(var i=0;i<termos.length;i++) if(it.idx.indexOf(termos[i])<0) return false;
    return true;
  }
  var grupos = [];
  LOCS.forEach(function(L){
    if(S.rua && L.split('-')[0]!==S.rua) return;
    var porEndereco = q && L.indexOf(q)>=0;
    var its = PORLOC[L].filter(function(x){
      if(S.fil && FIL[x.it.f]!==S.fil) return false;
      return porEndereco || casaItem(x.it);
    });
    if(its.length) grupos.push({L:L, its:its, pref: q && L.indexOf(q)===0 ? 0 : 1});
  });
  if(q) grupos.sort(function(a,b){ return a.pref-b.pref || (a.L<b.L?-1:a.L>b.L?1:0); });

  var h = '<div class="ruas">';
  h += '<button class="rua" data-rua="" aria-pressed="'+(S.rua?'false':'true')+'">Todas</button>';
  RUAKEYS.forEach(function(r){
    h += '<button class="rua" data-rua="'+esc(r)+'" aria-pressed="'+(S.rua===r?'true':'false')+'">'+esc(r)+
         '<i>'+RUAS[r].length+'</i></button>';
  });
  h += '</div>';

  ULTIMOS_GRUPOS = grupos;
  cont.innerHTML = '<span>'+grupos.length+' '+plural(grupos.length,'endereço','endereços')+' com material'+
    (grupos.length>120?' · mostrando 120':'')+'</span>';
  if(grupos.length){
    h += '<div class="btnrow"><button class="btn ghost" id="imp-end"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'+
      (grupos.length===1 ? 'Imprimir este endereço' : 'Imprimir estes '+grupos.length+' endereços')+
      '</button></div>';
  }
  if(!grupos.length){
    h += '<p class="empty"><b>Nenhum endereço aqui</b>Escolha outra rua, limpe a busca ou troque a filial.</p>';
  }
  grupos.slice(0,120).forEach(function(g){
    h += '<div class="locgroup"><h3>'+esc(g.L)+'<span class="dir">'+g.its.length+' '+
      plural(g.its.length,'item','itens')+
      '<button class="imp1" data-imp="'+esc(g.L)+'" title="Imprimir este endereço" '+
      'aria-label="Imprimir o endereço '+esc(g.L)+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button></span></h3>';
    g.its.forEach(function(x){
      h += '<button class="card" data-id="'+x.it.id+'"><div class="l1"><span class="code">'+x.it.c+
        '</span><span class="fil">'+FIL[x.it.f]+'</span></div><p class="desc">'+esc(x.it.d)+
        '</p><div class="l3"><span class="arm">arm '+x.arm+'</span>'+
        (x.it.ends.length>1?'<span class="flag ok">também em outros '+(x.it.ends.length-1)+'</span>':'')+
        '<span class="qty"><b>'+nq(x.q)+'</b><small>neste endereço</small></span></div></button>';
    });
    h += '</div>';
  });
  lista.innerHTML = h;
  var nova = lista.querySelector('.ruas');
  if(nova && rolagem) nova.scrollLeft = rolagem;
}

var ULTIMOS_GRUPOS = [];

function tituloDosEnderecos(grupos){
  if(grupos.length===1) return 'Endereço ' + grupos[0].L;
  if(S.rua) return 'Endereços da rua ' + S.rua;
  if(S.q) return 'Endereços com “' + elQ.value.trim() + '”';
  return 'Todos os endereços';
}

function imprimirEnderecos(grupos){
  if(!grupos.length) return;
  var itens = grupos.reduce(function(s,g){ return s + g.its.length; }, 0);
  if(grupos.length > 60 && !confirm('Vão sair ' + grupos.length + ' endereços, com ' + itens +
     ' itens. São várias páginas. Continuar?')) return;

  var h = '<div class="ph"><b>' + esc(tituloDosEnderecos(grupos)) + '</b><span>' +
          new Date().toLocaleString('pt-BR') + '</span></div>';
  h += '<p class="pinfo">Filial ' + (S.fil || 'todas') + ' · ' + grupos.length + ' ' +
       plural(grupos.length,'endereço','endereços') + ' · ' + itens + ' ' +
       plural(itens,'item','itens') + ' · base de ' + D.gerado.split('-').reverse().join('/') + '</p>';

  grupos.forEach(function(g){
    h += '<section class="pg"><h2>' + esc(g.L) + '</h2><table><thead><tr>' +
         '<th>Código</th><th>Descrição</th><th>Filial</th><th>Arm</th>' +
         '<th class="n">Saldo</th><th class="n">Contado</th></tr></thead><tbody>';
    g.its.forEach(function(x){
      h += '<tr><td class="m">' + x.it.c + '</td><td>' + esc(x.it.d) + '</td>' +
           '<td class="m">' + FIL[x.it.f] + '</td><td class="m">' + x.arm + '</td>' +
           '<td class="n m">' + nq(x.q) + '</td><td class="n"><span class="conta"></span></td></tr>';
    });
    h += '</tbody></table></section>';
  });

  document.getElementById('area-impressao').innerHTML = h;
  document.body.classList.add('imprimindo');
  window.print();
}

window.addEventListener('afterprint', function(){
  // espera um pouco: no celular o afterprint as vezes chega antes da folha ser montada
  setTimeout(function(){ document.body.classList.remove('imprimindo'); }, 1500);
});

var ULTIMOS_PEND = [];

function haQuanto(dia){
  if(!dia) return 'sem data';
  var n = HOJE - dia;
  if(n <= 0) return 'hoje';
  if(n === 1) return 'ontem';
  return 'há ' + n + ' dias';
}

function montarPendentes(){
  var P = D.pendentes || [], termos = S.q ? S.q.split(/\s+/) : [];
  var grupos = [], porNota = {};
  P.forEach(function(p){
    if(S.fil && FIL[p[0]] !== S.fil) return;
    var desc = DESCS[p[2]] || '';
    if(termos.length){
      var alvo = p[1] + ' ' + p[6] + ' ' + norm(desc);
      for(var i=0;i<termos.length;i++) if(alvo.indexOf(termos[i]) < 0) return;
    }
    var it = itemDe(p[0], p[1]);
    var l = {f:p[0], c:p[1], d:desc, a:p[3], saldo:p[4], ori:p[5], doc:p[6], dia:p[7], it:it,
             sug: it && it.ends.length ? it.ends[0].e : '', mais: it ? Math.max(0, it.ends.length-1) : 0};
    var k = l.f + '|' + l.doc;
    if(!porNota[k]){ porNota[k] = {f:l.f, doc:l.doc, dia:l.dia, its:[]}; grupos.push(porNota[k]); }
    porNota[k].its.push(l);
    if(l.dia && (!porNota[k].dia || l.dia < porNota[k].dia)) porNota[k].dia = l.dia;
  });
  grupos.sort(function(a,b){ return (a.dia||99999) - (b.dia||99999) || (a.doc < b.doc ? -1 : 1); });
  return grupos;
}

function renderPend(){
  if(!(D.pendentes || []).length){
    ULTIMOS_PEND = [];
    cont.innerHTML = '<span>A endereçar</span>';
    lista.innerHTML = '<p class="empty"><b>Nenhuma lista de pendentes na base</b>' +
      'Coloque na pasta dados a exportação dos produtos a endereçar e gere o app de novo.</p>';
    return;
  }
  var grupos = montarPendentes();
  ULTIMOS_PEND = grupos;
  var itens = grupos.reduce(function(s,g){ return s + g.its.length; }, 0);
  var maisVelha = grupos.length && grupos[0].dia ? HOJE - grupos[0].dia : 0;

  cont.innerHTML = '<span>' + itens + ' ' + plural(itens,'item','itens') + ' em ' + grupos.length + ' ' +
    plural(grupos.length,'nota','notas') + '</span>' +
    (maisVelha > 0 ? '<span>mais antiga ' + haQuanto(grupos[0].dia) + '</span>' : '');

  if(!grupos.length){
    lista.innerHTML = '<p class="empty"><b>Nada encontrado</b>Nenhum pendente com esse filtro. ' +
      'Limpe a busca ou troque a filial.</p>';
    return;
  }

  var h = '<div class="btnrow"><button class="btn ghost" id="imp-pend"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>' +
          'Imprimir esta lista</button></div>';
  grupos.forEach(function(g){
    var velho = g.dia && HOJE - g.dia > 7;
    h += '<div class="nfgroup' + (velho ? ' velho' : '') + '"><h3><span class="nf">NF ' + esc(g.doc) + '</span>' +
         '<span class="dir">' + data(g.dia) + ' · ' + (velho ? '<b>' + haQuanto(g.dia) + '</b>' : haQuanto(g.dia)) +

var ULTIMOS_INV = [], CHAVE_SEM = '\u0000sem';

function diaCurto(n){
  if(!n) return 'sem data';
  if(n === HOJE) return 'hoje';
  if(n === HOJE - 1) return 'ontem';
  var d = new Date(EPOCH + n*864e5);
  return String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0');
}

function montarInventario(){
  var M = D.movimentos || [];
  var dias = [];
  M.forEach(function(m){ if(dias.indexOf(m[7]) < 0) dias.push(m[7]); });
  dias.sort(function(a,b){ return b-a; });
  if(S.invDia === null) S.invDia = dias.length ? dias[0] : 'todos';

  var termos = S.q ? S.q.split(/\s+/) : [];
  var linhas = {}, ordem = [], tipos = {};
  M.forEach(function(m){
    if(S.invDia !== 'todos' && m[7] !== S.invDia) return;
    if(S.fil && FIL[m[0]] !== S.fil) return;
    if(m[10]) (tipos[m[10]] = tipos[m[10]] || {})[m[0] + '|' + m[1]] = 1;
    if(S.invTipo && m[10] !== S.invTipo) return;

    var it = itemDe(m[0], m[1]);
    var desc = DESCS[m[2]] || (it ? it.d : '');
    // a SD3 traz o endereco de onde saiu; sem ele (relacao antiga), usa os enderecos do saldo
    var locais = m[9] ? [{e:m[9], arm:m[8] || ''}]
      : (it && it.ends.length ? it.ends.map(function(x){ return {e:x.e, arm:x.arm}; })
                              : [{e:CHAVE_SEM, arm:m[8] || ''}]);
    if(termos.length){
      var alvo = m[1] + ' ' + norm(desc) + ' ' + norm(m[12] || '') + ' ' + norm(m[6] || '') + ' ' +
                 locais.map(function(x){ return x.e; }).join(' ');
      for(var i=0;i<termos.length;i++) if(alvo.indexOf(termos[i]) < 0) return;
    }
    var tm = parseInt(m[4], 10), saida = isNaN(tm) || tm > 500;
    locais.forEach(function(x){
      var k = m[0] + '|' + x.arm + '|' + x.e + '|' + m[1];
      if(!linhas[k]){
        var sis = null;
        if(it && x.e !== CHAVE_SEM){
          it.ends.forEach(function(en){
            if(en.e === x.e && (!x.arm || en.arm === x.arm)) sis = (sis || 0) + en.q;
          });
        }
        linhas[k] = {f:m[0], arm:x.arm, L:x.e, p:{c:m[1], d:desc, it:it}, saiu:0, entrou:0,
                     un:m[11] || '', destinos:[], sis:sis, n:locais.length};
        ordem.push(k);
      }
      var l = linhas[k];
      if(saida) l.saiu += m[3]; else l.entrou += m[3];
      if(m[12] && l.destinos.indexOf(m[12]) < 0) l.destinos.push(m[12]);
    });
  });

  var grupos = {}, lista_g = [], prods = {};
  ordem.forEach(function(k){
    var l = linhas[k], gk = l.f + '|' + l.arm + '|' + l.L;
    if(!grupos[gk]){ grupos[gk] = {k:gk, f:l.f, arm:l.arm, L:l.L, its:[]}; lista_g.push(grupos[gk]); }
    grupos[gk].its.push(l);
    prods[l.f + '|' + l.p.c] = 1;
  });
  lista_g.sort(function(a,b){
    var sa = a.L === CHAVE_SEM ? 1 : 0, sb = b.L === CHAVE_SEM ? 1 : 0;
    return sa - sb || a.f - b.f || (a.arm < b.arm ? -1 : a.arm > b.arm ? 1 : 0) ||
           (a.L < b.L ? -1 : a.L > b.L ? 1 : 0);
  });
  var contTipos = {};
  Object.keys(tipos).forEach(function(t){ contTipos[t] = Object.keys(tipos[t]).length; });
  return {dias:dias, tipos:contTipos, produtos:Object.keys(prods).length, grupos:lista_g};
}

  if(um){
    var alvo = ULTIMOS_GRUPOS.filter(function(g){ return g.L === um.dataset.imp; });
    imprimirEnderecos(alvo);

  if(e.target.closest('#imp-end')){ imprimirEnderecos(ULTIMOS_GRUPOS); return; }
  if(e.target.closest('#imp-pend')){ imprimirPendentes(ULTIMOS_PEND); return; }
  if(e.target.closest('#imp-inv')){ imprimirInventario(ULTIMOS_INV); return; }
  var ui = e.target.closest('[data-impinv]');
  if(ui){ imprimirInventario(ULTIMOS_INV.filter(function(g){ return g.k === ui.dataset.impinv; })); return; }
  if(e.target.closest('#sel-separar')){ separarSelecionados(); return; }
  if(e.target.closest('#sel-limpar')){ S.selec = {}; render(); return; }
  var ct = e.target.closest('[data-ctrl]');
  if(ct){ S.ctrl = ct.dataset.ctrl || null; render(); return; }
  var tp = e.target.closest('[data-tipo]');
  if(tp){ S.invTipo = tp.dataset.tipo || null; render(); return; }
  var dd = e.target.closest('[data-dia]');
  if(dd){ S.invDia = dd.dataset.dia === 'todos' ? 'todos' : +dd.dataset.dia; render(); return; }
  var c = e.target.closest('[data-id]');

  if(r){ S.rua = r.dataset.rua || null; render(); return; }
  var rm = e.target.closest('[data-rm]');

document.getElementById('jv-status').textContent = GEMINI ? 'pesquisa na internet com o Gemini'
                                                          : 'desligado: falta a chave do Gemini';

var JV_GEMINI_REGRAS = 'Você é o Jarvis, assistente do almoxarifado de uma operação de mineração no Brasil. ' +
  'Responda sempre em português do Brasil, de forma curta e prática, para quem trabalha no estoque: para que ' +
  'serve uma peça, onde é aplicada, equivalências entre marcas, cuidados de uso e de armazenagem. Use a pesquisa ' +
  'do Google para confirmar o que disser. Quando a pesquisa não for conclusiva sobre um número de peça ' +
  'específico, diga isso claramente em vez de supor. Você não tem acesso ao estoque da empresa: se perguntarem ' +
  'saldo, endereço ou quantidade, diga que isso está na busca do próprio app.';

/* código interno -> descrição do cadastro, só para o Gemini entender a pergunta */
function jvComDescricao(texto){
  var extras = [], vistos = {};
  (texto.match(/\b\d{7,9}\b/g) || []).forEach(function(c){
    var cod = c.padStart(9, '0');
    if(vistos[cod]) return;
    vistos[cod] = 1;
    var descs = {};
    for(var f = 0; f < FIL.length; f++){
      var it = MAPA[f + '|' + cod];
      if(it && it.d && it.d.indexOf('(sem') !== 0) descs[it.d] = 1;
    }
    var l = Object.keys(descs);
    if(l.length) extras.push('o código interno ' + cod + ' é "' + l.slice(0, 3).join('" ou "') + '"');
  });
  return extras.length ? texto + '\n\n(Para referência: ' + extras.join('; ') + '.)' : texto;
}

function jvBalao(tipo, conteudo, html){
  var d = document.createElement('div');
  d.className = 'jv-m ' + tipo + (html ? ' rico' : '');
  if(html) d.innerHTML = conteudo; else d.textContent = conteudo;
  jvMsgs.appendChild(d);
  jvMsgs.scrollTop = jvMsgs.scrollHeight;
  return d;
}

function jvErroGemini(status, msg){
  if(/API key not valid|API_KEY_INVALID/i.test(msg)) return 'A chave do Gemini é inválida. Confira a chave cadastrada.';
  if(status === 403 && /referer|referrer/i.test(msg))
    return 'A chave do Gemini não aceita pedidos deste endereço (restrição de site). Inclua este endereço nas restrições da chave.';
  if(status === 403) return 'O Gemini recusou o acesso: confira se a API está ativada para essa chave.';
  if(status === 429) return 'O limite gratuito do Gemini acabou por agora. Tente mais tarde.';
  if(status >= 500) return 'O Gemini está fora do ar agora. Tente de novo em instantes.';
  return 'O Gemini respondeu com erro ' + status + ': ' + String(msg).slice(0, 140);
}

function jvLerGemini(d){
  if(d.promptFeedback && d.promptFeedback.blockReason) throw new Error('O Gemini não quis responder essa pergunta.');
  var c = (d.candidates || [])[0] || {};
  var partes = (c.content && c.content.parts) || [];
  var texto = partes.filter(function(p){ return p.text && !p.thought; }).map(function(p){ return p.text; }).join('').trim();
  if(!texto) throw new Error(c.finishReason === 'SAFETY' ? 'O Gemini não quis responder essa pergunta.'
                                                        : 'O Gemini não trouxe resposta. Tente perguntar de outro jeito.');
  var g = c.groundingMetadata || {}, vistos = {};
  var fontes = (g.groundingChunks || []).map(function(x){ return x.web; })
    .filter(function(w){ if(!w || !/^https:\/\//.test(w.uri || '') || vistos[w.title]) return false; vistos[w.title] = 1; return true; })
    .slice(0, 5);
  return {texto: texto, fontes: fontes, sugestao: (g.searchEntryPoint || {}).renderedContent || ''};
}

async function jvChamarGemini(contents){
  /* Cada modelo tem a sua cota, e a pesquisa no Google tem outra à parte.
     Ordem: cada modelo com pesquisa, depois o mesmo sem pesquisa, depois o próximo.
     A combinação que funcionou fica lembrada para as próximas perguntas. */
  var tentativas = [];
  (GEMINI.modelos || []).forEach(function(m){ tentativas.push({modelo: m, busca: true}, {modelo: m, busca: false}); });
  // lembra só o modelo: com ele, sempre tenta primeiro com pesquisa (a cota de pesquisa volta no dia seguinte)
  var lembrado = (store('gemini_modo') || {}).modelo;
  if(lembrado){
    var dele = tentativas.filter(function(x){ return x.modelo === lembrado; });
    if(dele.length) tentativas = dele.concat(tentativas.filter(function(x){ return x.modelo !== lembrado; }));
  }
  var pular = {}, recusas = [];
  for(var i = 0; i < tentativas.length; i++){
    var t = tentativas[i];
    if(pular[t.modelo]) continue;
    var ctl = new AbortController(), tempo = setTimeout(function(){ ctl.abort(); }, 45000), resp;
    var corpo = {systemInstruction: {parts: [{text: JV_GEMINI_REGRAS}]}, contents: contents,
                 generationConfig: {temperature: 0.3}};
    if(t.busca) corpo.tools = [{google_search: {}}];
    try{
      resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(t.modelo) +
                         ':generateContent', {
        method: 'POST', signal: ctl.signal,
        headers: {'Content-Type': 'application/json', 'x-goog-api-key': GEMINI.chave},
        body: JSON.stringify(corpo)
      });
    }catch(e){
      clearTimeout(tempo);
      throw new Error(e && e.name === 'AbortError' ? 'O Gemini demorou demais para responder. Tente de novo.'
                                                   : 'Sem conexão com o Gemini. Confira a internet.');
    }
    clearTimeout(tempo);
    var dados = await resp.json().catch(function(){ return {}; });
    if(resp.ok){
      store('gemini_modo', {modelo: t.modelo});
      var r = jvLerGemini(dados);
      r.modelo = t.modelo; r.semBusca = !t.busca;
      return r;
    }
    var msg = String((dados.error || {}).message || '');
    var quem = t.modelo + (t.busca ? ' com pesquisa' : ' sem pesquisa') + ' (' + resp.status + '): ' + msg;
    if(resp.status === 404 || /not found|is not supported/i.test(msg)){ pular[t.modelo] = 1; continue; }
    // limite de uso ou instabilidade do Google: tenta a próxima combinação
    if(resp.status === 429 || resp.status >= 500){ recusas.push({s: resp.status, txt: quem}); continue; }
    if(resp.status === 400 && t.busca && /search|grounding|tool/i.test(msg)) continue;   // modelo sem pesquisa no Google
    var erro = new Error(jvErroGemini(resp.status, msg));
    erro.detalhe = quem.slice(0, 260);
    throw erro;
  }
  if(recusas.length){
    var so429 = recusas.every(function(r){ return r.s === 429; });
    var soFalha = recusas.every(function(r){ return r.s >= 500; });
    var e = new Error(so429 ? 'O Google recusou por limite de uso em todos os modelos que tentei.'
      : soFalha ? 'O Gemini está instável agora: todos os modelos que tentei falharam do lado do Google. Tente de novo em alguns minutos.'
      : 'O Google recusou em todos os modelos que tentei, por limite de uso ou instabilidade. Tente de novo em alguns minutos.');
    e.detalhe = recusas[0].txt.slice(0, 260);
    throw e;
  }
  throw new Error('Nenhum modelo da lista do Gemini respondeu. Atualize GEMINI_MODELOS no build.py.');
}

function jvMd(t){
  var h = esc(t);
  h = h.replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^[ \t]*[\*\-][ \t]+/gm, '• ');
  return '<div class="gmtx">' + h + '</div>';
}

async function jvPerguntar(texto, mostrar){
  texto = (texto || '').trim();
  if(!texto || JV.ocupado || !GEMINI) return;
  JV.ocupado = true; jvEnviar.disabled = true;
  jvTexto.value = ''; jvTexto.style.height = '';
  jvBalao('eu', mostrar || texto);
  var bolha = jvBalao('pensando', 'Pesquisando no Gemini…');
  var turno = {role: 'user', parts: [{text: jvComDescricao(texto)}]};
  try{
    var r = await jvChamarGemini(JV.hist.slice(-10).concat([turno]));
    bolha.className = 'jv-m gm rico';
    var h = jvMd(r.texto);
    if(r.fontes.length) h += '<div class="gmf">Fontes: ' + r.fontes.map(function(w){
      return '<a href="' + esc(w.uri) + '" target="_blank" rel="noopener noreferrer">' + esc(w.title || 'link') + '</a>';
    }).join(' · ') + '</div>';
    h += '<div class="jnota">' + (r.semBusca
      ? 'Respondido sem a pesquisa no Google (o limite de pesquisa acabou por agora): é conhecimento geral do Gemini, sem fontes. Confira com mais cuidado.'
      : 'Informação da internet. Confira antes de usar.') + '</div>';
    bolha.innerHTML = h;
    if(r.sugestao){   // o Google exige mostrar as sugestões de pesquisa junto da resposta
      var caixa = document.createElement('div');
      caixa.className = 'gms';
      caixa.attachShadow({mode: 'open'}).innerHTML = r.sugestao;
      bolha.appendChild(caixa);
    }
    JV.hist.push(turno, {role: 'model', parts: [{text: r.texto}]});
  }catch(e){
    bolha.className = 'jv-m erro';
    bolha.textContent = (e && e.message) || 'Não consegui pesquisar no Gemini agora.';
    if(e && e.detalhe){
      var det = document.createElement('div');
      det.className = 'gmdet';
      det.textContent = 'Detalhe do Google — ' + e.detalhe;
      bolha.appendChild(det);
    }
  }
  jvMsgs.scrollTop = bolha.offsetTop - 12;
  JV.ocupado = false; jvEnviar.disabled = false;
  if(window.innerWidth >= 860) jvTexto.focus();
}

function jvSobreItem(it){
  if(!it.d || it.d.indexOf('(sem') === 0){
    jvBalao('eu', 'Sobre o ' + it.c);
    jvBalao('erro', 'Esse produto veio sem descrição na base, então não tenho o que pesquisar.');
    return;
  }
  jvPerguntar('Para que serve e onde costuma ser aplicada esta peça: "' + it.d + '"? ' +
              'Se aparecerem na pesquisa, cite números equivalentes de outras marcas.',
              'Sobre o ' + it.c + ' · ' + it.d);
}

function jvBoasVindas(){
  jvMsgs.innerHTML = '';
  JV.hist = [];
  if(!GEMINI){
    jvBalao('sis', 'O Jarvis pesquisa na internet pelo Gemini, e ele ainda não está ligado: falta a chave. ' +
      'O passo a passo está no LEIA-ME, na parte “Ligando o Gemini”. Para saldo e endereço, use a busca do app.');
    return;
  }
  var d = jvBalao('ele', 'Olá, sou o Jarvis. Pesquiso na internet pelo Gemini: para que serve uma peça, ' +
    'onde é aplicada, equivalências entre marcas, cuidados de uso… Para saldo e endereço, use a busca do app.');
  var sug = document.createElement('div');
  sug.className = 'jv-sug';
  ['Para que serve o filtro Fleetguard FF5052?', 'Qual a diferença entre fluido de freio DOT 3 e DOT 4?',
   'Qual o equivalente do filtro Donaldson P550148?'].forEach(function(t){
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.perg = t; b.textContent = t;
    sug.appendChild(b);
  });
  d.appendChild(sug);
  var nota = document.createElement('div');
  nota.className = 'jnota';
  nota.textContent = 'O que você escrever vai para o Google. Não digite informação sigilosa da empresa.';
  d.appendChild(nota);
}

function abrirJarvis(pergunta, item){
  jvPainel.classList.add('open');
  document.body.classList.add('jv-aberto');
  if(window.innerWidth < 860) document.body.classList.add('locked');
  if(!jvMsgs.children.length) jvBoasVindas();
  jvTexto.disabled = !GEMINI; jvEnviar.disabled = !GEMINI || JV.ocupado;
  if(item && GEMINI) jvSobreItem(item);
  else if(pergunta && GEMINI) jvPerguntar(pergunta);
  else if(GEMINI && window.innerWidth >= 860) jvTexto.focus();
}

function fecharJarvis(){
  jvPainel.classList.remove('open');
  document.body.classList.remove('jv-aberto');
  if(!panel.classList.contains('open')) document.body.classList.remove('locked');
}

document.getElementById('jv-abrir').addEventListener('click', function(){ abrirJarvis(); });
document.getElementById('jv-fechar').addEventListener('click', fecharJarvis);
document.getElementById('jv-novo').addEventListener('click', function(){ if(!JV.ocupado) jvBoasVindas(); });
jvEnviar.addEventListener('click', function(){ jvPerguntar(jvTexto.value); });
jvTexto.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); jvPerguntar(jvTexto.value); }
});
jvTexto.addEventListener('input', function(){
  jvTexto.style.height = ''; jvTexto.style.height = Math.min(jvTexto.scrollHeight, 120) + 'px';
});
jvMsgs.addEventListener('click', function(e){
  var p = e.target.closest('[data-perg]');
  if(p) jvPerguntar(p.dataset.perg);
});

(function(){
  var n = (D.pendentes || []).length, b = document.getElementById('pendn');
  if(b){ b.textContent = n; b.hidden = n === 0; }
})();
renderFiltros(); badge(); render(); medirTopo();
})();
</script>


<script>
/* Recarrega a página sozinho quando sai uma versão nova da base.
   Funciona no servidor local e no site publicado pelo GitHub Pages.
   Aberto direto do disco (file://), falha na 1ª tentativa e para. */
(function(){
  var atual = null;
  function checar(){
    fetch('versao.txt', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){
        t = t.trim();
        if(!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(t)) return;  // nao e o servidor local
        if(atual === null) atual = t;
        else if(t !== atual){ location.reload(); return; }
        setTimeout(checar, 5000);
      })
      .catch(function(){});
  }
  checar();
})();
</script>
